# Pre-commit hooks for NOMAD. Install with `pre-commit install` (or run all via
# `pixi run precommit`). Keep these in sync with the lint CI workflow.

minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Reviewed redistribution licenses retain their upstream bytes.
        exclude: '(^licenses/mavsdk-phase-a/|\.(svg|patch)$)'
      - id: end-of-file-fixer
        exclude: '\.(svg|patch)$'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: '^docker/.*\.sh$'
        args: [--severity=warning]

  - repo: local
    hooks:
      - id: spdx-header
        name: SPDX license header
        description: Check for SPDX-License-Identifier in staged source files
        entry: >
          python -c "import sys;missing=[p for p in sys.argv[1:] if 'SPDX-License-Identifier' not in open(p, encoding='utf-8').read()];[print(f'SPDX-License-Identifier missing: {p}') for p in missing];exit(1 if missing else 0)"
        language: python
        files: \.(c|cc|cpp|cs|cxx|h|hpp|py|sh)$
