# Aircraft-side serial fan-out template. Review before copying to /etc/nomad/router.conf.
# Use a stable /dev/serial/by-id/... path and the reviewed ground-router destination.
# Loopback is a placeholder, not a remote aircraft deployment.
[General]
TcpServerPort=0
ReportStats=true
MavlinkDialect=ardupilotmega

[UartEndpoint flight_controller]
Device=/dev/serial/by-id/REPLACE_WITH_REVIEWED_FLIGHT_CONTROLLER
Baud=921600

[UdpEndpoint ground_router]
Mode=Normal
Address=127.0.0.1
Port=14560
