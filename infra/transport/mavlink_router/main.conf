# MAVLink Router Configuration for NOMAD
# Reference topology only. Do not install this file as a service configuration.
# scripts/services/mavlink_router.sh owns mavlink-routerd and generates its
# minimal runtime configuration from config/nomad.env.
#
# Management:
#   sudo systemctl status nomad-mavlink-router
#   sudo journalctl -u nomad-mavlink-router -f
#
# Purpose:
#   Routes MAVLink telemetry from Flight Controller to:
#   - Orchestrator (127.0.0.1:14550)
#   - Vision Process (127.0.0.1:14551)
#   - Navigation Bridge (127.0.0.1:14552)
#   - Ground Station via Tailscale (100.x.x.x:14560)
#
# Ground-side multi-link routing is a separate process on the ground computer.
# It can consume this service's LTE/Tailscale leg and the RadioMaster leg, then
# select one outbound route. This onboard serial/IP service remains responsible
# for forwarding flight-controller traffic to onboard clients and the GCS.

[General]
# TCP server for direct connections (optional)
TcpServerPort=5760

# Report statistics periodically
ReportStats=true

# Log to systemd journal
#Log=/var/log/mavlink-router.log

# MAVLink version (1 or 2)
MavlinkDialect=ardupilotmega

# ============================================================
# Flight Controller Input (USB Serial - any ArduPilot board)
# ============================================================

# Primary: USB Serial connection (flight controller connected via USB)
[UartEndpoint usb_fc]
Device=/dev/ttyACM0
Baud=921600

# Alternative: UART Serial (if using TELEM port instead of USB)
# [UartEndpoint uart_fc]
# Device=/dev/ttyTHS1
# Baud=921600

# Note: Any ArduPilot flight controller (USB serial) connects the
# same way. Verify device with: ls -l /dev/ttyACM* or dmesg | grep tty
# Grant permissions: sudo usermod -a -G dialout $USER

# ============================================================
# Orchestrator Endpoint (Local)
# ============================================================

[UdpEndpoint orchestrator]
Mode=Normal
Address=127.0.0.1
Port=14550

# The NOMAD C++ core listens on this port for MAVLink telemetry
# and sends commands back.

# ============================================================
# Vision Process Endpoint (Local)
# ============================================================

[UdpEndpoint vision]
Mode=Normal
Address=127.0.0.1
Port=14551

# The Vision Process may need telemetry for:
# - Drone position/attitude for visual servoing
# - Flight mode for behavior adaptation

# ============================================================
# Ground Station Endpoint (via Tailscale)
# ============================================================

[UdpEndpoint groundstation]
Mode=Normal
# NOTE: This static config is only used by systemd (manual install).
# The dynamic startup path discovers the GCS IP from Tailscale peers and
# passes -e on the command line, bypassing this file entirely.
# Set Address to your ground station's Tailscale IP (e.g. Address=100.64.0.10).
# Left as loopback so the service still starts if unset — telemetry simply goes
# nowhere until you set it.
Address=127.0.0.1
Port=14560

# PRODUCTION: Update to Raspberry Pi ground station address when ready
# Address=nomad-groundstation-pi.tail1d521d.ts.net
#
# To find your Ground Station's Tailscale hostname/IP:
#   tailscale status
#
# This allows Mission Planner to receive telemetry over 4G/LTE
# even when the drone is beyond WiFi range.
#
# Mission Planner should connect to:
#   UDP server on the NOMAD GroundLinkRouter local port (default 14600).
#   The router merges LTE (14560) and RadioMaster (14550) and pushes
#   the unified stream to that port.
#
# The Ground Station can send commands back through this same
# endpoint, and mavlink-router will forward them to the FC.

# ============================================================
# Navigation Bridge Endpoint (Local)
# ============================================================

[UdpEndpoint nav_bridge]
Mode=Normal
Address=127.0.0.1
Port=14552

# The ROS telemetry observer binds this port to receive position, GPS and
# battery data. It has no command-capable transport. Kept separate from the
# orchestrator (14550). Override with NOMAD_ROS_OBSERVATION_PORT.

# ============================================================
# Debug: Local UDP broadcast (optional)
# ============================================================

# [UdpEndpoint debug]
# Mode=Normal
# Address=127.0.0.1
# Port=14553
#
# Use this for debugging with tools like mavproxy or QGroundControl
# running locally on the Jetson.

# ============================================================
# Notes
# ============================================================
#
# 1. Verify serial device:
#    ls -l /dev/ttyTHS*
#    dmesg | grep tty
#
# 2. Grant permissions if needed:
#    sudo usermod -a -G dialout nomad
#
# 3. Test MAVLink stream:
#    mavproxy.py --master=/dev/ttyTHS1 --baud 921600
#
# 4. Verify Tailscale connectivity:
#    ping <groundstation-tailscale-ip>
#
# 5. Mission Planner connection:
#    - Connect Mission Planner to UDP, port 14600
#    - Ensure Windows Firewall allows UDP 14560 for LTE input
#    - Keep UDP 14550 reserved for RadioMaster input

# Ground-side N-link host configuration and port ownership:
# ../ground_router/README.md (this file remains an aircraft-side reference).
# Native Mission Planner uses UDPCl to router-owned loopback 14600.
# The ground C++ listener uses 14601, fed from router-owned 14602; it must not
# compete with the ground physical RadioMaster listener on 14550.
