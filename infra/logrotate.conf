# NOMAD Log Rotation Configuration
# Install: sudo cp infra/logrotate.conf /etc/logrotate.d/nomad
# Then test with: sudo logrotate -f /etc/logrotate.d/nomad

/home/*/nomad_logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    size 50M
    create 0644 root root
}

# Container temp logs (if mounted)
/tmp/nomad_*.log {
    daily
    rotate 3
    compress
    missingok
    notifempty
    size 20M
}
