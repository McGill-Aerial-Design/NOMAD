# NOMAD Log Rotation Configuration
# Installed to /etc/logrotate.d/nomad by infra/systemd/install.sh.
# Test with: sudo logrotate -f /etc/logrotate.d/nomad

/home/*/nomad_logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    size 50M
    create 0644 root root
}

# Container temp logs (if mounted)
/tmp/nomad_*.log {
    daily
    rotate 3
    compress
    missingok
    notifempty
    size 20M
}
