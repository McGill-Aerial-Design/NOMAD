name: nomad-dev

services:
  # Optional: ArduPilot SITL (Copter-4.7.1 stable).
  # Exposes MAVLink on TCP :5760 (connect Mission Planner, mavproxy, etc.).
  # The C++ smoke tests receive a host UDP copy. The ROS adapter destination is
  # opt-in so the SITL-only profile does not depend on a missing ROS container.
  sitl:
    # ArduPilot Copter 4.7.1, built from source once with:
    #   docker build -t nomad-sitl:copter-4.7.1 \
    #     --build-arg COPTER_TAG=Copter-4.7.1 \
    #     https://github.com/radarku/ardupilot-sitl-docker.git
    image: nomad-sitl:copter-4.7.1
    profiles: ["sitl"]
    entrypoint: ["/bin/sh", "/nomad/sitl-entrypoint.sh"]
    volumes:
      - ./sitl-entrypoint.sh:/nomad/sitl-entrypoint.sh:ro
      - ./sitl-fence.parm:/nomad/sitl-fence.parm:ro
      - ./sitl-streams.parm:/nomad/sitl-streams.parm:ro
    # sim_vehicle.py launches MAVProxy on a console; without a TTY it exits
    # immediately and the container restart-loops. Allocate a pseudo-TTY.
    tty: true
    stdin_open: true
    environment:
      VEHICLE: ArduCopter
      MODEL: quad
      SPEEDUP: "1"
      # Enable ArduPilot's polygon fence (FENCE_ENABLE/ACTION/TYPE) so the C++
      # mission-fence upload/readback acceptance scenario runs against an
      # enabled fence. Applied by docker/sitl-entrypoint.sh via --add-param-file.
      SITL_FENCE_DEFAULTS: "/nomad/sitl-fence.parm"
      # ArduPilot streams position, attitude and extended status only after a GCS
      # requests the group, and the C++ core deliberately does not request
      # streams, so the vehicle is configured to emit them on SERIAL0 - the link
      # MAVProxy forwards to every host-side copy. See docker/sitl-streams.parm.
      SITL_STREAM_DEFAULTS: "/nomad/sitl-streams.parm"
      INSTANCE: "0"
      LAT: "42.3898"
      LON: "-71.1476"
      ALT: "14"
      DIR: "270"
      # The first --out feeds the NOMAD dual-link LTE leg on the host: 14560 is
      # the plugin's default LTE MAVLink port (leave LTE remote host empty). The
      # router
      # then serves the merged stream to Mission Planner on UDP 14600
      # (RouterLocalPort) — no TCP bridge involved.
      # 14570 feeds the C++ core smoke tests; the always-on 14572 copy feeds
      # the link-recovery scenario's UDP relay (it binds 14572 as its
      # upstream, so the stack must forward there regardless of
      # NOMAD_CORE_SITL_PORT).
      SITL_UDP_OUTPUT_ADDRESS: >-
        udp:host.docker.internal:14560 --out
        udp:host.docker.internal:14570 --out
        udp:host.docker.internal:14572
    ports:
      - "5760:5760"   # TCP MAVLink (single-client; held by in-container MAVProxy)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Relay SITL's extra serial port to the host for Mission Planner. Port 5760
  # is single-client and already consumed by the MAVProxy that sim_vehicle.py
  # runs inside the container, so a GCS on the host must use 5762 — which the
  # sitl service does not publish. Connect Mission Planner to TCP 127.0.0.1:5762.
  mp_bridge:
    image: alpine/socat
    profiles: ["sitl"]
    command: tcp-listen:5762,fork,reuseaddr tcp:sitl:5762
    ports:
      - "5762:5762"
    depends_on:
      - sitl
    restart: unless-stopped
