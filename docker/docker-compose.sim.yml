# NOMAD full simulation stack — ZED Isaac Sim + ArduPilot SITL + Edge Core.
#
# Replaces the physical Jetson + ZED camera + flight controller with:
# - Isaac Sim container (simulated ZED, ROS2 topics, VIO, video)
# - ArduPilot SITL (simulated flight controller with MAVLink)
# - Edge Core (same API as the real Jetson)
# - MediaMTX (RTSP video relay)
#
# Prerequisites:
# - NVIDIA Container Toolkit (nvidia-container-toolkit)
# - Docker Compose v2+
#
# Quick start:
#   docker compose -f docker/docker-compose.sim.yml up
#
# Then open http://localhost:8000/docs for the Edge Core API.
# Connect Mission Planner to TCP localhost:5760 for MAVLink SITL.
# RTSP video: rtsp://localhost:8554/primary
#
# Build only (no GPU needed for build):
#   docker compose -f docker/docker-compose.sim.yml build
#
# Full stack with SITL:
#   docker compose -f docker/docker-compose.sim.yml --profile sitl up
#
name: nomad-sim

services:
  # ==============================================================
  # Isaac Sim + ZED ROS2 Wrapper
  # ==============================================================
  # The core simulation container. Publishes ZED-compatible ROS2 topics
  # from a headless Isaac Sim instance. The ros_http_bridge and
  # simple_video_bridge run inside this container, just as they would
  # inside the real Jetson's Isaac ROS container.
  isaac_sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile.isaac_sim
      args:
        ISAAC_SIM_IMAGE: nvcr.io/nvidia/isaac-sim:4.5.0
    image: nomad-isaac-sim:latest
    container_name: nomad_isaac_sim
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      NOMAD_SIM_MODE: "true"
      NOMAD_ENABLE_VISION: "true"
      ISAAC_SIM_HEADLESS: "1"
      ISAAC_SIM_WORLD: ${ISAAC_SIM_WORLD:-}
      ISAAC_SIM_DRONE_START_X: ${ISAAC_SIM_DRONE_START_X:-0.0}
      ISAAC_SIM_DRONE_START_Y: ${ISAAC_SIM_DRONE_START_Y:-0.0}
      ISAAC_SIM_DRONE_START_Z: ${ISAAC_SIM_DRONE_START_Z:-1.0}
      ISAAC_SIM_DRONE_START_YAW: ${ISAAC_SIM_DRONE_START_YAW:-0.0}
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DISPLAY: ""
      NOMAD_API_PORT: "8000"
      NOMAD_API_KEY: ${NOMAD_API_KEY:-}
      NOMAD_INTERNAL_TOKEN: ${NOMAD_INTERNAL_TOKEN:-}
      ROS_HTTP_BRIDGE_RATE: ${ROS_HTTP_BRIDGE_RATE:-5}
      ROS_HTTP_BRIDGE_VIO_TOPIC: /zed/zed_node/odom
      ROS_HTTP_BRIDGE_MAG_TOPIC: /zed/zed_node/imu/mag
      ROS_HTTP_BRIDGE_TRANSPORT: http
      VIDEO_BRIDGE_WIDTH: ${VIDEO_BRIDGE_WIDTH:-640}
      VIDEO_BRIDGE_HEIGHT: ${VIDEO_BRIDGE_HEIGHT:-360}
      VIDEO_BRIDGE_FPS: ${VIDEO_BRIDGE_FPS:-15}
      VIDEO_BRIDGE_BITRATE: ${VIDEO_BRIDGE_BITRATE:-800}
      NOMAD_DEFAULT_VIDEO_TOPIC: /zed/zed_node/rgb/color/rect/image
      ZED_CAMERA_MODEL: ${ZED_CAMERA_MODEL:-zed2i}
      ZED_CAMERA_NAME: ${ZED_CAMERA_NAME:-zed}
      ZED_GRAB_RESOLUTION: ${ZED_GRAB_RESOLUTION:-HD720}
      ZED_DEPTH_MODE: ${ZED_DEPTH_MODE:-NEURAL_LIGHT}
    volumes:
      - ../edge_core:/workspaces/nomad-sim/edge_core:ro
      - ../config:/workspaces/nomad-sim/config:ro
      - ../infra/mediamtx.yml:/workspaces/nomad-sim/infra/mediamtx.yml:ro
      - isaac_sim_cache:/root/.nvidia-omniverse/cache
      - isaic_sim_data:/root/.nvidia-omniverse/data
    networks:
      - nomad-net
    shm_size: 4g
    healthcheck:
      test: ["CMD-SHELL", "ros2 topic list 2>/dev/null | grep -q /zed/zed_node/odom || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20
    restart: unless-stopped

  # ==============================================================
  # Edge Core — REST API + MAVLink + state management
  # ==============================================================
  # Same image as docker/Dockerfile.dev but configured for simulation
  # with vision enabled (since Isaac Sim provides the camera feed).
  edge_core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    image: nomad-edge-dev:latest
    container_name: nomad_edge_core_sim
    ports:
      - "8000:8000"
    environment:
      NOMAD_SIM_MODE: "true"
      NOMAD_ENABLE_VISION: "true"
      NOMAD_ALLOW_INSECURE_REMOTE: "true"
      NOMAD_API_PORT: "8000"
      NOMAD_DOCKER_HOST_IP: "172.17.0.1"
      ISAAC_CONTAINER_NAME: "nomad_isaac_sim"
      ISAAC_SIM_MODE: "true"
      ROS_HTTP_BRIDGE_VIO_TOPIC: /zed/zed_node/odom
      NOMAD_DEFAULT_VIDEO_TOPIC: /zed/zed_node/rgb/color/rect/image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nomad-net
    depends_on:
      isaac_sim:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  # ==============================================================
  # MediaMTX — RTSP relay for video streaming
  # ==============================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: nomad_mediamtx_sim
    ports:
      - "8554:8554"
      - "9997:9997"
    volumes:
      - ../infra/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - nomad-net
    restart: unless-stopped

  # ==============================================================
  # ArduPilot SITL — simulated flight controller (opt-in)
  # ==============================================================
  # Provides a full MAVLink Copter simulation. Connect Mission Planner
  # to TCP port 5760. Edge Core connects to the SITL MAVLink UDP stream
  # on the nomad-net network.
  sitl:
    image: radarku/ardupilot-sitl:latest
    container_name: nomad_sitl_sim
    profiles: ["sitl"]
    environment:
      VEHICLE: arducopter
      MODEL: quad
      SPEEDUP: 1
    ports:
      - "5760:5760"
      - "14550:14550/udp"
      - "14552:14552/udp"
    networks:
      - nomad-net
    restart: unless-stopped

networks:
  nomad-net:
    driver: bridge

volumes:
  isaac_sim_cache:
  isaic_sim_data:
