name: Bug report
description: Report a problem with the NOMAD Mission Planner plugin.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not paste real Tailscale IPs, API keys,
        or other secrets — redact them with placeholders like `<jetson-ip>`.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mission Planner plugin (C#)
        - Gimbal / payload / HID
        - Profiles / video / links
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select the saved aircraft profile in Mission Planner
        2. Open the affected NOMAD control
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How are you running NOMAD?
      placeholder: |
        - Mission Planner version:
        - OS / arch:
        - Simulator or aircraft/firmware:
        - Commit: `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs or tracebacks (redact secrets).
      render: shell
