name: Bug report
description: Report a problem with NOMAD (Edge Core, Mission Planner plugin, or deployment).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not paste real Tailscale IPs, API keys,
        or other secrets — redact them with placeholders like `<jetson-ip>`.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Edge Core (Python service)
        - Mission Planner plugin (C#)
        - Modules (SLAM / perception / payload)
        - Deployment (Docker / systemd / scripts)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pixi run dev`
        2. GET /api/...
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How are you running NOMAD?
      placeholder: |
        - Mode: sim (Docker) / Jetson hardware
        - OS / arch:
        - Python / pixi version:
        - Commit: `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs or tracebacks (redact secrets).
      render: shell
