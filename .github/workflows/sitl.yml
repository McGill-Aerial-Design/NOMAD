name: safety-qualification

# Run the full Copter and QuadPlane suites whenever a PR or main push changes
# runtime, vehicle, actuator, fence, or simulator behavior. The scope gate keeps
# ordinary UI/docs changes from rebuilding both simulators. Scheduled and
# manual runs always perform the full qualification.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly

permissions:
  contents: read

concurrency:
  group: sitl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-scope:
    name: Determine full SITL scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select qualification scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_BRANCH: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci/sitl_scope.py

  sitl:
    name: SITL loop closure (velocity + geofence)
    needs: qualification-scope
    if: needs.qualification-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Most scenarios read the regular host copy on 14570. The link-recovery
    # and zero-delivery tasks override this to the private 14572 relay copy.
    env:
      NOMAD_CORE_SITL_PORT: "14570"
    steps:
      # The transport is the pinned third_party/MAVSDK submodule, so the checkout
      # must be recursive for the core to configure at all.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The ArduPilot SITL image (Copter-4.7.1, built from source) is not
      # published anywhere, so build it here. The build is heavy but cached
      # across runs via the GitHub Actions cache, so steady-state runs restore
      # it instead of recompiling ArduPilot.
      - name: Build ArduPilot SITL image
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/radarku/ardupilot-sitl-docker.git
          build-args: COPTER_TAG=Copter-4.7.1
          push: false
          load: true
          tags: nomad-sitl:copter-4.7.1
          cache-from: type=gha,scope=sitl
          cache-to: type=gha,mode=max,scope=sitl

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      - name: Bring up the dev + SITL stack
        run: pixi run dev-up

      # ArduPilot needs ~20-30 s for EKF/GPS before it will arm. The scenarios
      # also wait for heartbeat + a GPS fix internally, so this is just a head
      # start to let the in-container MAVProxy open its TCP ports.
      - name: Let SITL warm up
        run: sleep 25

      - name: Build runtime and qualification tools once
        run: pixi run build-sitl-tools

      - name: Qualify runtime authority and independent source on isolated Copter
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          authority_container=""
          stop_authority() {
            if [[ -n "$authority_container" ]]; then
              docker stop "$authority_container" >/dev/null 2>&1 || true
            fi
          }
          trap stop_authority EXIT
          authority_container=$(docker compose -p nomad-authority -f docker/docker-compose.dev.yml run \
            --rm --name nomad-authority-sitl -d --no-deps \
            -e SITL_UDP_OUTPUT_ADDRESS="udp:host.docker.internal:14690 --out udp:host.docker.internal:14691" \
            sitl)
          sleep 25
          pixi run --frozen python scripts/dev/core_sitl_authority.py \
            2>&1 | tee "$RUNNER_TEMP/runtime-authority-sitl.json"

      - name: Retain runtime authority SITL evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-authority-sitl
          path: ${{ runner.temp }}/runtime-authority-sitl.json
          if-no-files-found: warn

      - name: Qualify installed CLI Copter LAND on three clean isolated simulators
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          land_container=""
          stop_land() {
            if [[ -n "$land_container" ]]; then
              docker stop "$land_container" >/dev/null 2>&1 || true
            fi
          }
          trap stop_land EXIT
          for attempt in 1 2 3; do
            land_container=$(docker compose -p nomad-authority -f docker/docker-compose.dev.yml run \
              --rm --name nomad-authority-sitl -d --no-deps \
              -e SITL_UDP_OUTPUT_ADDRESS="udp:host.docker.internal:14690 --out udp:host.docker.internal:14691" \
              sitl)
            sleep 25
            pixi run --frozen python scripts/dev/core_sitl_copter_land.py \
              2>&1 | tee "$RUNNER_TEMP/runtime-copter-land-$attempt.json"
            docker stop "$land_container" >/dev/null
            land_container=""
          done

      - name: Retain installed CLI Copter LAND timing and observation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-copter-land-sitl
          path: ${{ runner.temp }}/runtime-copter-land-*.json
          if-no-files-found: warn

      - name: C++ runtime telemetry observation scenario
        run: pixi run --skip-deps core-sitl-status

      - name: MAVSDK connect/status smoke
        run: pixi run run-mavsdk-sitl-smoke | tee "$RUNNER_TEMP/mavsdk-connectivity-runtime.txt"

      - name: Retain connectivity runtime metrics
        uses: actions/upload-artifact@v6
        with:
          name: mavsdk-connectivity-runtime
          path: ${{ runner.temp }}/mavsdk-connectivity-runtime.txt
          if-no-files-found: error

      - name: Record connectivity build metrics
        run: python scripts/dev/mavsdk_build_metrics.py

      - name: C++ command authorization and flow scenario
        run: pixi run --skip-deps core-sitl-command-flow

      - name: C++ mission execution scenario
        run: pixi run --skip-deps core-sitl-mission

      - name: C++ velocity watchdog scenario (H-01..H-04)
        run: pixi run --skip-deps core-sitl-velocity-watchdog

      - name: C++ relay pulse acknowledgements (H-06, SR-PAY-01..03)
        run: pixi run --skip-deps core-sitl-payload

      - name: C++ link-loss injection scenario (H-03, SR-LNK-01/03)
        run: pixi run --skip-deps core-sitl-link-loss

      # SR-LNK-03 transport-level zero-delivery proof: a pymavlink observer
      # watches the CLI's actual wire setpoints through a tee relay and the
      # vehicle must stop after the zero. Runs on the stack's 14572 copy like
      # the link-recovery scenario (the relay binds it as upstream).
      - name: C++ zero-delivery proof (SR-LNK-03, H-03)
        run: pixi run --skip-deps core-sitl-zero-delivery

      - name: C++ link-recovery scenario (degraded-link semantics)
        run: pixi run --skip-deps core-sitl-link-recovery

      # Proves the 1 Hz GCS heartbeat opens a heartbeat-gated relay leg (the
      # mechanism real mavlink-router and MAVProxy setups require). Must run
      # on the stack's default 14570 copy; it binds its own client port.
      - name: C++ GCS-heartbeat relay-gate scenario (SR-LNK-04)
        run: pixi run --skip-deps core-sitl-gcs-heartbeat

      - name: Velocity loop-closure scenario (H-01..H-04, SR-VEL/LNK/VIO)
        run: pixi run --skip-deps sitl-scenario

      - name: Geofence containment scenario (H-05, SR-FEN-02; C++ CLI drives the vehicle)
        run: pixi run --skip-deps sitl-fence

      # Upload/readback leaves an ArduPilot polygon active. Keep it after the
      # guided-flight containment check so that persisted autopilot state cannot
      # reject the containment scenario's in-fence target.
      - name: C++ geofence upload/readback scenario (H-05, SR-FEN-01)
        run: pixi run --skip-deps core-sitl-geofence

      - name: SITL logs on failure
        if: failure()
        run: docker logs nomad-dev-sitl-1 2>&1 | tail -120 || true

      - name: Tear down
        if: always()
        run: pixi run dev-down

  quadplane-observation:
    name: QuadPlane identity, takeoff, transitions, route, recovery and landing qualification
    needs: qualification-scope
    if: needs.qualification-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build pinned ArduPlane SITL image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.sitl-plane
          build-args: ARDUPILOT_REVISION=dbe792162d06cab66c3475fd5556bf7a120f119e
          push: false
          load: true
          tags: nomad-sitl:plane-4.7.1-quadplane-tilttri
          cache-from: type=gha,scope=sitl-plane-4.7.1
          cache-to: type=gha,mode=max,scope=sitl-plane-4.7.1

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      - name: Prove disarmed simulated RC fault delivery on two clean instances
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          probe_container=""
          stop_probe() {
            if [[ -n "$probe_container" ]]; then
              docker stop "$probe_container" >/dev/null 2>&1 || true
            fi
          }
          trap stop_probe EXIT
          for attempt in 1 2; do
            probe_container=$(docker compose -p nomad-quadplane-probe -f docker/docker-compose.quadplane.yml run \
              --rm --name nomad-quadplane-rc-probe -d --no-deps \
              -e SITL_UDP_OUTPUT_ADDRESS=udp:host.docker.internal:14680 \
              -e SITL_UDP_OBSERVER_ADDRESS=udp:host.docker.internal:14681 \
              quadplane_sitl)
            sleep 25
            pixi run --frozen --quiet core-sitl-quadplane-rc-loss-probe 2>&1 \
              | tee "$RUNNER_TEMP/quadplane-rc-probe-$attempt.json"
            docker stop "$probe_container" >/dev/null
            probe_container=""
          done

      - name: Retain disarmed RC fault-delivery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quadplane-disarmed-rc-fault-probe
          path: ${{ runner.temp }}/quadplane-rc-probe-*.json
          if-no-files-found: warn

      - name: Build runtime and qualification tools once
        run: pixi run build-sitl-tools

      - name: Bring up pinned QuadPlane SITL
        run: pixi run quadplane-sitl-up

      - name: Verify firmware revision inside the simulator
        run: |
          test "$(docker compose -f docker/docker-compose.quadplane.yml exec -T quadplane_sitl git -C /ardupilot rev-parse HEAD)" = "dbe792162d06cab66c3475fd5556bf7a120f119e"

      - name: Let QuadPlane telemetry become ready
        run: sleep 25

      - name: Observe identity, telemetry and baseline modes
        run: pixi run --skip-deps core-sitl-quadplane-observe

      - name: Qualify NOMAD arm and QuadPlane VTOL takeoff
        run: pixi run --skip-deps core-sitl-quadplane-vtol-takeoff

      - name: Reset QuadPlane SITL before transition qualification
        run: |
          pixi run quadplane-sitl-down
          pixi run quadplane-sitl-up
          sleep 25

      - name: Qualify pinned QuadPlane VTOL-to-fixed-wing transition
        run: pixi run --skip-deps core-sitl-quadplane-transition

      - name: Reset QuadPlane SITL before route qualification
        run: |
          pixi run quadplane-sitl-down
          pixi run quadplane-sitl-up
          sleep 25

      - name: Qualify pinned QuadPlane fixed-wing route navigation
        run: pixi run --skip-deps core-sitl-quadplane-route

      - name: Reset QuadPlane SITL before recovery qualification
        run: |
          pixi run quadplane-sitl-down
          pixi run quadplane-sitl-up
          sleep 25

      - name: Qualify pinned QuadPlane fixed-wing recovery after route
        run: pixi run --skip-deps core-sitl-quadplane-recovery

      - name: Reset QuadPlane SITL before transition-back qualification
        run: |
          pixi run quadplane-sitl-down
          pixi run quadplane-sitl-up
          sleep 25

      - name: Qualify recovered QuadPlane fixed-wing-to-VTOL transition
        run: pixi run --skip-deps core-sitl-quadplane-transition-back

      - name: Reset QuadPlane SITL before VTOL landing qualification
        run: |
          pixi run quadplane-sitl-down
          pixi run quadplane-sitl-up
          sleep 25

      - name: Qualify full pinned QuadPlane chain through VTOL landing
        run: pixi run --skip-deps core-sitl-quadplane-vtol-landing

      - name: QuadPlane SITL logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.quadplane.yml logs --tail 160 || true

      - name: Tear down
        if: always()
        run: pixi run quadplane-sitl-down

  safety-qualification-gate:
    name: Safety qualification gate
    if: always()
    needs: [qualification-scope, sitl, quadplane-observation]
    runs-on: ubuntu-latest
    steps:
      - name: Require both full suites when safety paths change
        env:
          SCOPE_RESULT: ${{ needs.qualification-scope.result }}
          REQUIRED: ${{ needs.qualification-scope.outputs.required }}
          COPTER_RESULT: ${{ needs.sitl.result }}
          QUADPLANE_RESULT: ${{ needs.quadplane-observation.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"
          if [[ "$REQUIRED" == "true" ]]; then
            test "$COPTER_RESULT" = "success"
            test "$QUADPLANE_RESULT" = "success"
          elif [[ "$REQUIRED" == "false" ]]; then
            echo "Full SITL was not required for this change; the Copter and QuadPlane jobs were skipped by path scope."
          else
            echo "Invalid qualification scope output; expected true or false." >&2
            exit 1
          fi
