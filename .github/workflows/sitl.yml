name: sitl

# End-to-end loop-closure against a real ArduPilot SITL vehicle for the
# safety-critical velocity and geofence core (the §4.5 verification the safety
# case calls for — see tests/sitl/README.md and docs/safety.md).
#
# This is deliberately NOT on every push/PR: it builds ArduPilot from source
# and drives a live autopilot, so it runs nightly and on demand. The fast unit
# + SC-coverage gates in test.yml protect every PR; this proves the same
# mitigations close the loop on an actual flight controller.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly

permissions:
  contents: read

concurrency:
  group: sitl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitl:
    name: SITL loop closure (velocity + geofence)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The link-recovery scenario relays the SITL stream, so it must reach a
    # host port the relay can bind (docker-compose publishes 14570; 14572 is
    # free). MAVProxy forwards to this port and every core-sitl-* task reads
    # the same variable, so one value serves the whole job.
    env:
      NOMAD_CORE_SITL_PORT: "14572"
    steps:
      # The C++ codec compiles against headers generated from the pinned
      # third_party/ardupilot-mavlink submodule (see scripts/dev/generate_mavlink.py).
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The ArduPilot SITL image (Copter-4.7.1, built from source) is not
      # published anywhere, so build it here. The build is heavy but cached
      # across runs via the GitHub Actions cache, so steady-state runs restore
      # it instead of recompiling ArduPilot.
      - name: Build ArduPilot SITL image
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/radarku/ardupilot-sitl-docker.git
          build-args: COPTER_TAG=Copter-4.7.1
          push: false
          load: true
          tags: nomad-sitl:copter-4.7.1
          cache-from: type=gha,scope=sitl
          cache-to: type=gha,mode=max,scope=sitl

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      - name: Bring up the dev + SITL stack
        run: pixi run dev-up

      # ArduPilot needs ~20-30 s for EKF/GPS before it will arm. The scenarios
      # also wait for heartbeat + a GPS fix internally, so this is just a head
      # start to let the in-container MAVProxy open its TCP ports.
      - name: Let SITL warm up
        run: sleep 25

      - name: C++ core telemetry smoke test (Phase 2)
        run: pixi run core-sitl-status

      - name: C++ core command flow (Phase 3/4)
        run: pixi run core-sitl-command-flow

      - name: C++ mission executor scenario (Phase 5)
        run: pixi run core-sitl-mission

      # Runs while the vehicle is still disarmed (the mission executor waits for
      # disarm) because the geofence scenario requires a disarmed start.
      - name: C++ geofence upload/readback scenario (H-05, SR-FEN-01)
        run: pixi run core-sitl-geofence

      - name: C++ velocity watchdog scenario (H-01..H-04)
        run: pixi run core-sitl-velocity-watchdog

      - name: C++ payload relay scenario (H-06, SR-PAY-01..03)
        run: pixi run core-sitl-payload

      - name: C++ link-loss injection scenario (H-03, SR-LNK-01/03)
        run: pixi run core-sitl-link-loss

      - name: C++ link-recovery scenario (degraded-link semantics)
        run: pixi run core-sitl-link-recovery

      # Proves the 1 Hz GCS heartbeat opens a heartbeat-gated relay leg (the
      # mechanism real mavlink-router and MAVProxy setups require). Must run
      # on the stack's default 14570 copy; it binds its own client port.
      - name: C++ GCS-heartbeat relay-gate scenario (SR-LNK-04)
        run: pixi run core-sitl-gcs-heartbeat

      - name: Velocity loop-closure scenario (H-01..H-04, SR-VEL/LNK/VIO)
        run: pixi run sitl-scenario

      - name: Geofence containment scenario (H-05, SR-FEN-02; C++ CLI drives the vehicle)
        run: pixi run sitl-fence

      # The gimbal scenario needs a vehicle that has NOT flown: state left by the
      # velocity/fence scenarios (persisted across the mount reboot) suppresses
      # mount actuation. Recreate the SITL container for a clean vehicle —
      # sim_vehicle launches with -w, so a fresh container = wiped EEPROM.
      - name: Recreate SITL for a clean gimbal vehicle
        run: |
          docker compose -f docker/docker-compose.dev.yml --profile sitl up -d --force-recreate sitl
          sleep 25

      # Configures a servo mount + reboots to apply MNT1_TYPE, then verifies the
      # mount points where commanded. Exit 2 (mount never actuates) is a defensive
      # skip net; on the clean vehicle above the scenario actually verifies.
      - name: Gimbal mount-control scenario (DO_MOUNT_CONTROL/CONFIGURE)
        run: |
          set +e
          pixi run sitl-gimbal
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Gimbal SITL scenario skipped — mount did not actuate"
            exit 0
          fi
          exit "$code"

      - name: SITL logs on failure
        if: failure()
        run: docker logs nomad-dev-sitl-1 2>&1 | tail -120 || true

      - name: Tear down
        if: always()
        run: pixi run dev-down
