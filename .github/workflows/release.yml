name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MP_DIR: 'C:\Program Files (x86)\Mission Planner'

jobs:
  core:
    name: core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            generator: TGZ
            extension: tar.gz
          - os: windows-latest
            platform: windows
            generator: ZIP
            extension: zip
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Qualify core tests, lifecycle, and A to B to A authority reset
        run: |
          pixi run test-core
          pixi run python scripts/dev/runtime_lifecycle_qualification.py
          pixi run python scripts/dev/build_release_core_fixtures.py
          pixi run python scripts/dev/release_process_qualification.py --core-a build/release-fixtures/core-A --core-b build/release-fixtures/core-B
      - name: Build reviewed production core
        run: pixi run build-core-release
      - name: Package core for this platform
        shell: bash
        run: |
          pixi run package-core
          pixi run python scripts/dev/verify_core_package.py build/package
          mkdir -p release-assets
          cp build/package/nomad-core-*.${{ matrix.extension }} release-assets/
      - uses: actions/upload-artifact@v6
        with:
          name: release-core-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  windows-clients:
    name: plugin and standalone router
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v3
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read reviewed Mission Planner target
        run: |
          $version = (Get-Content scripts/release/mission-planner-target.json -Raw | ConvertFrom-Json).version
          "MP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Cache Mission Planner
        id: mp-cache
        uses: actions/cache@v5
        with:
          path: mp-portable.zip
          key: missionplanner-${{ env.MP_VERSION }}
      - name: Download pinned Mission Planner
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: |
          $url = "https://firmware.ardupilot.org/Tools/MissionPlanner/MissionPlanner-$env:MP_VERSION.zip"
          Invoke-WebRequest $url -OutFile mp-portable.zip
      - name: Stage reference assemblies
        run: |
          $temporary = Join-Path $env:RUNNER_TEMP 'mp-extract'
          Expand-Archive mp-portable.zip $temporary
          $exe = Get-ChildItem $temporary -Recurse -Filter MissionPlanner.exe | Select-Object -First 1
          if (-not $exe) { throw 'MissionPlanner.exe not found' }
          New-Item -ItemType Directory -Force $env:MP_DIR | Out-Null
          Copy-Item (Join-Path $exe.Directory.FullName '*') $env:MP_DIR -Recurse -Force
      - name: Generate plugin release identity
        run: |
          $tagArgs = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tagArgs = @('--tag', $env:GITHUB_REF_NAME) }
          python scripts/release/identity.py component --component plugin --platform windows `
            --architecture any --output build/release/package-identity.json `
            --csharp build/release/ReleaseIdentity.cs --required NOMADPlugin.dll @tagArgs
          if ($LASTEXITCODE -ne 0) { throw 'identity generation failed' }
      - name: Build plugin and router
        run: |
          msbuild mission_planner/src/NOMADPlugin.csproj /nologo /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'plugin build failed' }
          pwsh -File scripts/build/build_ground_router.ps1
          if ($LASTEXITCODE -ne 0) { throw 'router build failed' }
      - name: Qualify plugin contracts and standalone router rollback
        run: |
          pwsh -File scripts/build/test_plugin_core_client.ps1
          if ($LASTEXITCODE -ne 0) { throw 'plugin core client tests failed' }
          pwsh -File scripts/build/test_plugin_config_migration.ps1
          if ($LASTEXITCODE -ne 0) { throw 'plugin configuration tests failed' }
          pwsh -File scripts/build/test_plugin_duallink.ps1
          if ($LASTEXITCODE -ne 0) { throw 'router tests failed' }
          pixi run python scripts/dev/ground_router_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'router smoke failed' }
          pwsh -File scripts/build/build_release_router_fixtures.ps1
          if ($LASTEXITCODE -ne 0) { throw 'router fixture build failed' }
          pixi run python scripts/dev/release_process_qualification.py --router-a build/release-fixtures/router-A --router-b build/release-fixtures/router-B
          if ($LASTEXITCODE -ne 0) { throw 'router rollback qualification failed' }
      - name: Package independent client payloads
        run: |
          $identity = Get-Content build/release/package-identity.json -Raw | ConvertFrom-Json
          $stage = Join-Path $env:RUNNER_TEMP 'plugin-stage'
          New-Item -ItemType Directory -Force $stage, release-assets | Out-Null
          Copy-Item mission_planner/src/bin/Release/NOMADPlugin.dll $stage
          Copy-Item mission_planner/packaging/INSTALL.ps1 $stage
          Copy-Item mission_planner/packaging/README.md $stage
          Copy-Item build/release/package-identity.json $stage
          Compress-Archive "$stage/*" "release-assets/NOMADPlugin-$($identity.release_version)-windows-any.zip"
          Compress-Archive 'build/ground-router/*' `
            "release-assets/NOMADLinkRouter-$($identity.release_version)-windows-x86_64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows-clients
          path: release-assets/*
          if-no-files-found: error

  aggregate:
    name: Verify complete release set and publish
    needs: [core, windows-clients]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Qualify manifest integrity and component transaction failure paths
        run: pixi run test-release-lifecycle
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify common tagged source and every artifact digest
        shell: bash
        run: |
          tag_args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag_args=(--tag "$GITHUB_REF_NAME"); fi
          python scripts/release/identity.py aggregate --directory release-assets \
            --output release-assets/release-manifest.json "${tag_args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: NOMAD-complete-release-set
          path: release-assets/*
          if-no-files-found: error
      - name: Publish only the fully verified tagged release set
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: release-assets/*
