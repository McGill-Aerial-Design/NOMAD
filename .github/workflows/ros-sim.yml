# ros-sim.yml — Tier-1 real-ROS integration gate
#
# This workflow closes the ROS adapter coverage gap that existed because
# rclpy was absent from all hosted CI environments: it builds a
# self-contained ROS2 Humble image (docker/Dockerfile.sim-ros) that compiles
# the receive-only MAVLink observer + nomad_ros adapter into a colcon workspace and ships
# rclpy + pymavlink, then runs the ROS GTests and real node against an
# in-process MAVLink responder. Tests cover telemetry freshness and prove
# removed ROS control inputs do not produce aircraft mutations.
#
# Runs on every PR and push that touches the C++ core, the ROS adapter, the
# sim-ros image, or the integration test — CPU-only, no GPU needed. The
# Tier-2 GPU image (docker/Dockerfile.sim-isaac, Isaac ROS base) cannot run on
# hosted runners and is validated separately via a
# manual workflow_dispatch job in docker.yml (requires a self-hosted GPU runner).

name: ros-sim

on:
  push:
    paths:
      - "CMakeLists.txt"
      - ".gitmodules"
      - "third_party/MAVSDK"
      - "third_party/MAVSDK/**"
      - "third_party/ardupilot-mavlink"
      - "third_party/ardupilot-mavlink/**"
      - "src/**"
      - "include/**"
      - "ros2/**"
      - "python/**"
      - "infra/**"
      - "tools/**"
      - "examples/**"
      - "pyproject.toml"
      - "README.md"
      - "docker/Dockerfile.sim-ros"
      - "docker/ros_entrypoint.sh"
      - "tests/test_ros_observation_boundary.py"
      - "tests/ros/**"
      - ".github/workflows/ros-sim.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - ".gitmodules"
      - "third_party/MAVSDK"
      - "third_party/MAVSDK/**"
      - "third_party/ardupilot-mavlink"
      - "third_party/ardupilot-mavlink/**"
      - "src/**"
      - "include/**"
      - "ros2/**"
      - "python/**"
      - "infra/**"
      - "tools/**"
      - "examples/**"
      - "pyproject.toml"
      - "README.md"
      - "docker/Dockerfile.sim-ros"
      - "docker/ros_entrypoint.sh"
      - "tests/test_ros_observation_boundary.py"
      - "tests/ros/**"
      - ".github/workflows/ros-sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros-integration:
    name: nomad_ros adapter integration test (CPU, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The sim-ros image compiles the read-only ROS telemetry observer.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Build the Tier-1 sim-ros image (compiles nomad_ros and its receive-only
      # MAVLink observation target). This is compile evidence only; the
      # test workflow owns the deterministic runtime qualification.
      # Cache is scoped to "sim-ros" so it does not evict the SITL cache.
      - name: Build nomad-sim-ros image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.sim-ros
          push: false
          load: true
          tags: nomad-sim-ros:latest
          cache-from: type=gha,scope=sim-ros
          cache-to: type=gha,mode=max,scope=sim-ros

      # Run both GTests and the integration suite. tests/ is volume-mounted so
      # the image always runs current code without a rebuild.
      # This is the direct docker equivalent of `pixi run test-ros-integration`.
      - name: Run nomad_ros translation and integration tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/opt/nomad/tests \
            nomad-sim-ros:latest \
            bash -c 'ctest --test-dir /ws/build/nomad_ros --output-on-failure && python3 -m pytest tests/ros/ -v'

      # Emit container diagnostics on failure so failures are diagnosable without
      # a local reproduction.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== nomad-sim-ros image layers ==="
          docker image history nomad-sim-ros:latest || true
          echo "=== last run stderr (captured above by docker run) ==="
          echo "Re-run with: docker run --rm -v \$PWD/tests:/opt/nomad/tests nomad-sim-ros:latest bash -c 'ctest --test-dir /ws/build/nomad_ros --output-on-failure && python3 -m pytest tests/ros/ -v -s'"
