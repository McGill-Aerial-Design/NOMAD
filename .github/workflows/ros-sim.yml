# ros-sim.yml — Tier-1 real-ROS integration gate
#
# This workflow closes the ROS adapter coverage gap that existed because
# rclpy was absent from all hosted CI environments: it builds a
# self-contained ROS2 Humble image (docker/Dockerfile.sim-ros) that compiles
# the C++ nomad_core + nomad_ros adapter into a colcon workspace and ships
# rclpy + pymavlink, then runs the real nomad_vehicle_node inside it against
# an in-process MAVLink responder with VIO + cmd_vel publishers
# (tests/ros/test_nomad_ros_integration.py).
#
# Runs on every PR and push that touches the C++ core, the ROS adapter, the
# sim-ros image, or the integration test — CPU-only, no GPU needed. The
# Tier-2 GPU image (docker/Dockerfile.sim-isaac, full Isaac ROS + ZED SDK +
# nvblox) cannot run on hosted runners and is validated separately via a
# manual workflow_dispatch job in docker.yml (requires a self-hosted GPU runner).

name: ros-sim

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "ros2/**"
      - "docker/Dockerfile.sim-ros"
      - "docker/ros_entrypoint.sh"
      - "tests/ros/**"
      - ".github/workflows/ros-sim.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "ros2/**"
      - "docker/Dockerfile.sim-ros"
      - "docker/ros_entrypoint.sh"
      - "tests/ros/**"
      - ".github/workflows/ros-sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros-integration:
    name: nomad_ros adapter integration test (CPU, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Build the Tier-1 sim-ros image (compiles nomad_core + nomad_ros).
      # Cache is scoped to "sim-ros" so it does not evict the dev-image or
      # SITL caches.
      - name: Build nomad-sim-ros image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.sim-ros
          push: false
          load: true
          tags: nomad-sim-ros:latest
          cache-from: type=gha,scope=sim-ros
          cache-to: type=gha,mode=max,scope=sim-ros

      # Run the integration test suite.  tests/ is volume-mounted so the image
      # always runs current code without a rebuild.
      # This is the direct docker equivalent of `pixi run test-ros-integration`.
      - name: Run nomad_ros integration tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/tests:/opt/nomad/tests \
            nomad-sim-ros:latest \
            python3 -m pytest tests/ros/ -v

      # Emit container diagnostics on failure so failures are diagnosable without
      # a local reproduction.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== nomad-sim-ros image layers ==="
          docker image history nomad-sim-ros:latest || true
          echo "=== last run stderr (captured above by docker run) ==="
          echo "Re-run with: docker run --rm -v \$PWD/tests:/opt/nomad/tests nomad-sim-ros:latest python3 -m pytest tests/ros/ -v -s"
