name: csharp
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: csharp-${{ github.ref }}
  cancel-in-progress: true
env:
  MP_DIR: 'C:\Program Files (x86)\Mission Planner'
defaults:
  run:
    shell: pwsh
jobs:
  plugin:
    name: Mission Planner plugin build and tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v3
      - name: Read reviewed Mission Planner target
        run: |
          $version = (Get-Content scripts/release/mission-planner-target.json -Raw | ConvertFrom-Json).version
          "MP_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/cache@v5
        id: mp-cache
        with:
          path: mp-portable.zip
          key: missionplanner-${{ env.MP_VERSION }}
      - name: Download reviewed host reference bundle
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: |
          $url = "https://firmware.ardupilot.org/Tools/MissionPlanner/MissionPlanner-$env:MP_VERSION.zip"
          Invoke-WebRequest $url -OutFile mp-portable.zip
      - name: Stage host references on the disposable runner
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "mp-extract"
          Expand-Archive -Path mp-portable.zip -DestinationPath $tmp -Force
          $exe = Get-ChildItem $tmp -Recurse -Filter MissionPlanner.exe | Select-Object -First 1
          if (-not $exe) { throw "MissionPlanner.exe missing from portable bundle" }
          if ($exe.VersionInfo.FileVersion -ne $env:MP_VERSION) { throw "Unexpected Mission Planner version" }
          New-Item -ItemType Directory -Force -Path $env:MP_DIR | Out-Null
          Copy-Item -Path (Join-Path $exe.Directory.FullName '*') -Destination $env:MP_DIR -Recurse -Force
      - name: Build-only isolation tests
        run: powershell -NoProfile -File scripts/build/test_build_plugin_windows.ps1
      - name: Build product DLL (never install)
        run: powershell -NoProfile -File scripts/build/build_plugin_windows.ps1
      - name: Run retained product gates
        run: |
          $checks = @('lint_plugin_deadcode', 'test_plugin_gimbal', 'test_plugin_payload',
            'test_plugin_config_validation', 'test_plugin_geometry',
            'test_plugin_audio', 'test_plugin_version', 'test_ground_router',
            'test_plugin_gimbal_ui', 'test_plugin_router_ui', 'test_plugin_video')
          foreach ($check in $checks) {
            & powershell -NoProfile -File "scripts/build/$check.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$check failed with exit $LASTEXITCODE" }
          }
      - name: Upload product DLL only
        uses: actions/upload-artifact@v6
        with:
          name: NOMADPlugin
          path: mission_planner/src/bin/Release/NOMADPlugin.dll
          if-no-files-found: error
