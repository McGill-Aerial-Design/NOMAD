name: docker

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jetson-image:
    name: build Jetson image (aarch64, self-hosted)
    # The all-in-one Jetson image is based on the NVIDIA Isaac ROS aarch64 dev
    # base — it does not build on generic hosted runners.
    # It only runs on manual dispatch and requires a self-hosted ARM64 runner
    # (or build locally with `docker buildx build --platform linux/arm64`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ARM64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build Jetson image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f docker/Dockerfile.jetson \
            -t ghcr.io/${{ github.repository }}-jetson:latest \
            .

  sim-isaac-image:
    name: build Isaac ROS sim image (x86_64 GPU, self-hosted)
    # The Tier-2 Isaac ROS simulation image mirrors Dockerfile.jetson on x86_64,
    # targeting a developer
    # workstation with a discrete NVIDIA GPU instead of a Jetson Orin.
    #
    # Requirements for the self-hosted runner this job targets:
    #   - An NVIDIA GPU with nvidia-container-toolkit configured
    #   - The Isaac ROS x86_64 dev base image present locally
    #     (build via isaac_ros_common before running this job)
    #   - Runner label: [self-hosted, X64] — change to [self-hosted, gpu] or a
    #     custom label if your GPU runner uses a different registration label.
    #
    # Hosted runners (ubuntu-latest) have no GPU and cannot build this image.
    # Run `pixi run sim-ros-build` + `pixi run test-ros-integration` locally or
    # via the ros-sim.yml workflow for the CPU-only Tier-1 path.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build Isaac ROS sim image (x86_64, no push)
        run: |
          docker build \
            -f docker/Dockerfile.sim-isaac \
            --build-arg BASE_IMAGE=isaac_ros_dev-x86_64 \
            -t nomad-sim-isaac:latest \
            .
