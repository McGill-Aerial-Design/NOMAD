name: docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "edge_core/**"
      - "tailscale/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-image:
    name: build + push dev image (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-dev
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  jetson-image:
    name: build Jetson image (aarch64, self-hosted)
    # The all-in-one Jetson image is based on the NVIDIA Isaac ROS aarch64 dev
    # base and downloads the ZED SDK — neither builds on generic hosted runners.
    # It only runs on manual dispatch and requires a self-hosted ARM64 runner
    # (or build locally with `docker buildx build --platform linux/arm64`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Build Jetson image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f docker/Dockerfile.jetson \
            -t ghcr.io/${{ github.repository }}-jetson:latest \
            .
