name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (sim path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - name: Run tests
        run: pixi run test

  safety-core:
    name: SC core (100% branch coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - name: Gate edge_core/safety at 100% branch coverage
        run: pixi run cov-safety

  dev-image:
    name: build dev docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build dev image (no push)
        # Keeps the contributor's hardware-free image healthy. Built but not
        # pushed here; docker.yml publishes it from main.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          push: false
          load: true
          tags: nomad-edge-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image (sim health endpoint)
        run: |
          docker run -d --name nomad-dev -p 8000:8000 nomad-edge-dev:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "health OK"; ok=1; break
            fi
            sleep 2
          done
          docker logs nomad-dev || true
          docker rm -f nomad-dev || true
          test "${ok:-0}" = "1" || { echo "::error::sim image did not become healthy"; exit 1; }
