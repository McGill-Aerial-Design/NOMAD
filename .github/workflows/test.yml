name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (sim path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Run Python tests
        run: pixi run test-python

  core:
    name: C++ core
    runs-on: ubuntu-latest
    steps:
      # The transport is the pinned third_party/MAVSDK submodule, so the checkout
      # must be recursive for the core to configure at all.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Build and test C++ core
        run: pixi run test-core

  mavsdk-phase-a:
    name: MAVSDK Phase A (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Build the MAVSDK smoke target
        run: >-
          python scripts/dev/mavsdk_phase_a_metrics.py --build
          --output "${{ runner.temp }}/mavsdk-phase-a-${{ matrix.os }}.json"
      - name: Retain Phase A build metrics
        uses: actions/upload-artifact@v6
        with:
          name: mavsdk-phase-a-metrics-${{ matrix.os }}
          path: ${{ runner.temp }}/mavsdk-phase-a-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Verify reviewed MAVSDK provenance
        run: pixi run check-mavsdk-phase-a
      - name: Run deterministic MAVSDK peer qualification
        run: pixi run test-mavsdk-phase-a
      - name: Run MAVSDK command, link, fence and velocity regressions
        run: pixi run test-mavsdk-phase-b
      - name: Prove authority cancellation at the MAVLink UDP peer
        run: pixi run test-mavsdk-authority-wire
