name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tools and regression guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Run Python tests
        # Service and release suites run on both platforms in core-release.
        run: >-
          pixi run test-python
          --ignore=tests/test_runtime_lifecycle.py
          --ignore=tests/test_release_identity.py
          --ignore=tests/test_release_lifecycle.py
          --ignore=tests/test_release_windows.py
          --ignore=tests/test_release_linux.py
      - name: Verify authority SITL observation and guard regressions
        run: pixi run test-authority-sitl-harness

  core:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # The transport is the pinned third_party/MAVSDK submodule, so the checkout
      # must be recursive for the core to configure at all.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Build and test C++ core
        run: pixi run test-core
      - name: Exercise authenticated runtime and installed CLI against a deterministic peer
        run: pixi run python scripts/dev/runtime_ipc_smoke.py
      - name: Qualify clean/crash restart and persistent audit history without hardware
        run: pixi run python scripts/dev/runtime_lifecycle_qualification.py

  core-release:
    name: Core release qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Verify service provisioning without privileged installation
        run: pixi run test-runtime-service-artifacts
      - name: Verify native release transactions and failure paths without privileges
        run: pixi run test-release-lifecycle
      - name: Build distinguishable release A and B runtime fixtures
        run: pixi run python scripts/dev/build_release_core_fixtures.py
      - name: Qualify binary activation rollback and fresh runtime authority
        run: >-
          pixi run python scripts/dev/release_process_qualification.py
          --core-a build/release-fixtures/core-A --core-b build/release-fixtures/core-B
      - name: Verify production package and staged installation
        run: pixi run verify-core-package && pixi run verify-core-staged-install

  mavsdk-qualification:
    name: MAVSDK qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Build the connectivity smoke and record metrics
        run: >-
          python scripts/dev/mavsdk_build_metrics.py --build
          --output "${{ runner.temp }}/mavsdk-connectivity-${{ matrix.os }}.json"
      - name: Retain connectivity smoke build metrics
        uses: actions/upload-artifact@v6
        with:
          name: mavsdk-connectivity-metrics-${{ matrix.os }}
          path: ${{ runner.temp }}/mavsdk-connectivity-${{ matrix.os }}.json
          if-no-files-found: error
      - name: Verify reviewed MAVSDK provenance
        run: pixi run verify-mavsdk-provenance
      - name: Run deterministic MAVSDK peer qualification
        run: pixi run test-mavsdk-connectivity
      - name: Run MAVSDK command, link, fence and velocity regressions
        run: pixi run test-mavsdk-transport-qualification
      - name: Prove authority cancellation at the MAVLink UDP peer
        run: pixi run test-mavsdk-authority-wire
