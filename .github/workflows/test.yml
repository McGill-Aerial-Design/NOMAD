name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (sim path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Run Python tests
        run: pixi run test-python

  core:
    name: C++ core
    runs-on: ubuntu-latest
    steps:
      # The C++ codec compiles against headers generated from the pinned
      # third_party/ardupilot-mavlink submodule (see scripts/dev/generate_mavlink.py).
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
      - name: Build and test C++ core
        run: pixi run test-core

  dev-image:
    name: build dev docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build dev image (no push)
        # Keeps the contributor's hardware-free image healthy. Built but not
        # pushed here; docker.yml publishes it from main.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.dev
          push: false
          load: true
          tags: nomad-edge-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image (sim health endpoint)
        run: |
          docker run -d --name nomad-dev -p 8000:8000 nomad-edge-dev:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "health OK"; ok=1; break
            fi
            sleep 2
          done
          docker logs nomad-dev || true
          docker rm -f nomad-dev || true
          test "${ok:-0}" = "1" || { echo "::error::sim image did not become healthy"; exit 1; }
