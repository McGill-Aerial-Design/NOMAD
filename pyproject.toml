[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-tools"
version = "0.2.1"
description = "NOMAD development and qualification tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "The NOMAD Authors" }]
keywords = ["drone", "uav", "mavlink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Runtime dependencies
dependencies = []

[project.optional-dependencies]
dev = [
    "pymavlink>=2.4",
    "psutil>=5.9",
    "ruff==0.15.16",
    "pytest>=8.0",
    "pre-commit>=3.8",
]
docs = ["properdocs>=1.6", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/YoussGm3o8/NOMAD"
Repository = "https://github.com/YoussGm3o8/NOMAD"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py310"
# Vendored code (the MAVSDK submodule) is pinned upstream and must not be
# reformatted or linted by the repository gates.
extend-exclude = [".pixi", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# line-length (120) is enforced via E501. Files that hold unbreakable shell
# command / URL string literals opt out per-file below rather than disabling the
# rule everywhere.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F403", "F405", "E402"]
"scripts/dev/**" = ["E402", "E501"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
