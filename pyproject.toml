[tool.ruff]
line-length = 120
target-version = "py310"
# Local environments and archived dependency checkouts are not first-party tooling.
extend-exclude = [".pixi", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# line-length (120) is enforced via E501. Files that hold unbreakable shell
# command / URL string literals opt out per-file below rather than disabling the
# rule everywhere.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F403", "F405", "E402"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
