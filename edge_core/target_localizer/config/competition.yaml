# ============================================================
# Target Localizer Configuration - AEAC 2026 Task 1
# ============================================================
#
# The ground station owns the building geometry now. This node just
# converts circle detections into absolute (lat, lon, height_AGL) and
# hands them off via /api/task/1/target/list_structured. There are no
# building.* parameters anymore — the entire building model lives in
# Mission Planner under %MyDocuments%/NOMAD/Task1/building_corners.json.
#
# USAGE:
#   ros2 launch target_localizer target_localizer.launch.py
#
# OR load this file directly:
#   ros2 run target_localizer target_localizer_node \
#       --ros-args --params-file config/competition.yaml
# ============================================================

target_localizer:
  ros__parameters:

    # ZED optical origin relative to the vehicle GPS antenna, in body frame.
    # Used to back-project from the camera to a GPS lat/lon when MAVROS
    # reports the antenna position. Positive forward is along vehicle heading.
    camera:
      gps_offset_forward_m: 0.35
      gps_offset_right_m: 0.0

    # ---- Team / IO ----
    team_name: "MAD"
    output_dir: "/workspaces/isaac_ros-dev/data/task1_captures"

    # ---- Target Detection ----
    dedup_radius_m: 0.5         # Targets within this 3D distance are merged
    min_confidence: 0.35

    # ---- HSV Circle Detector (live-tunable) ----
    # ros2 param set /target_localizer circle.min_circularity 0.65
    circle:
      min_radius_px: 12
      max_radius_px: 400
      min_circularity: 0.70
      min_solidity: 0.80
      blur_kernel: 7

# ============================================================
# Operational Checklist
# ============================================================
#
# Before flight:
#   [ ] RTK fix on the Cube (or local pose if EKF origin is set)
#   [ ] ZED RGB + depth + camera_info topics live
#   [ ] Servo angle topic publishing
#   [ ] One test capture at the flight line, review on GCS
#   [ ] output_dir writable, Google Drive upload tested
#   [ ] Calibrate the GCS building model: Mission Planner -> Task 1 ->
#       Capture preset corner GPS for corners 1 and 2 to lock translation+rotation.
#
# During flight:
#   [ ] Pilot positions UAV ~3-5m from each candidate target
#   [ ] Operator triggers /target_localizer/capture_target
#   [ ] Operator confirms color + face/plane on the GCS (face/plane is
#       computed locally on the ground station from the target's GPS).
#   [ ] After landing, /target_localizer/save_targets dumps a debug log.
#   [ ] Submit Task_1_MAD_targets.txt from Mission Planner -> Upload panel.
