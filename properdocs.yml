site_name: NOMAD
site_description: Aircraft profiles, video, custom controls and link routing for Mission Planner
site_url: https://mcgill-aerial-design.github.io/NOMAD/
repo_url: https://github.com/McGill-Aerial-Design/NOMAD
repo_name: McGill-Aerial-Design/NOMAD
theme:
  name: material
  palette:
    primary: red
    accent: red
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
nav:
  - Get started:
      - Overview: index.md
      - Installation and operation: operations.md
  - Systems:
      - Video and tracking: video.md
      - Architecture and reuse: architecture.md
  - Safety:
      - Safety and qualification: safety.md
      - Native termination: native-termination.md
  - Development:
      - Build and checks: development.md
      - Product scope and AEAC tasks: prd.md
      - CONOPS traceability: conops-requirements.md
  - AEAC ideas:
      - Brainstorming: brainstorming.md
validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: warn
