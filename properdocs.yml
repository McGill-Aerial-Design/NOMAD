# NOMAD documentation site — built with ProperDocs (Material theme)
# Serve locally:  pixi run docs
# Build:         pixi run docs-build

site_name: NOMAD
site_description: A reusable drone edge + ground-control framework
site_url: https://github.com/McGill-Aerial-Design/NOMAD
repo_url: https://github.com/McGill-Aerial-Design/NOMAD
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/McGill-Aerial-Design/NOMAD

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - tables

plugins:
  - search
  - redirects:
      redirect_maps: {}

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Architecture: architecture.md
  - Writing a Module: writing_a_module.md
  - Deployment: deployment.md
  - Configuration: configuration.md
  - API Reference: api_reference.md
  - Safety Case:
      - Overview: safety/README.md
      - Partition (SC/SR/NC): safety/partition.md
      - Hazards (FHA-lite): safety/hazards.md
      - Requirements: safety/requirements.md
      - Traceability: safety/traceability.md
validation:
  links:
    # Safety-case docs link to source files (../../edge_core/...) so they are
    # clickable when read in-repo / on GitHub; those targets live outside the
    # built docs tree, so treat "not found" as info rather than failing --strict.
    not_found: info
    absolute_links: info
    unrecognized_links: info

extra_css: []
extra_javascript: []
