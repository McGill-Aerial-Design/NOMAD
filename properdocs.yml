site_name: NOMAD
site_description: Mission Planner profiles, custom controls and link routing
repo_url: https://github.com/YoussGm3o8/NOMAD
theme:
  name: material
markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
plugins:
  - search
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Development: development.md
  - Operations: operations.md
  - Safety: safety.md
  - Qualification: qualification.md
  - Native termination: native-termination.md
  - Product requirements: prd.md
  - CONOPS traceability: conops-requirements.md
validation:
  links:
    not_found: info
    absolute_links: info
    unrecognized_links: info
