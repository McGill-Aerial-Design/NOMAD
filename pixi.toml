# NOMAD developer / simulation environment.
#
# Pixi (https://pixi.sh) provides a reproducible, cross-platform dev environment
# that does NOT require the Jetson, CUDA, ZED SDK, or ROS2 — those are device-only
# and are installed separately on hardware. The dev Docker image lives in
# docker/Dockerfile.dev (hardware-free Edge Core + ArduPilot SITL stack).
#
# Quick start:
#   pixi run dev      # run Edge Core in hardware-free sim mode on :8000
#   pixi run test     # pytest
#   pixi run lint     # ruff check
#   pixi run fmt      # ruff format
#   pixi run docs     # serve the docs site locally

[workspace]
name = "nomad"
version = "0.2.1"
description = "NOMAD drone edge + ground-control framework — dev/sim environment"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

# ==================== Features ====================

[feature.dev.dependencies]
python = "3.13.*"
pre-commit = ">=3.8"
shellcheck = ">=0.10"

[feature.dev.pypi-dependencies]
nomad-edge = { path = ".", editable = true, extras = ["dev", "docs"] }

# Isaac Sim (Omniverse) integration is intentionally not included in this
# baseline — it needs a high-end NVIDIA GPU host. It will return later as a
# remote simulation server. The hardware-free dev stack below (Edge Core +
# ArduPilot SITL) covers local development without a GPU.

# ==================== Environments ====================

[environments]
default = { features = ["dev"] }

# ==================== Tasks ====================

[tasks]

# Edge Core
dev = "python -m edge_core.main --sim --host 0.0.0.0 --port 8000"
# Coverage floor is a ratchet set just below the current level so coverage can
# only trend up; raise it as more of the codebase gets tested.
test = "pytest --cov=edge_core --cov=infra/tailscale --cov-report=term-missing --cov-fail-under=85"
# Plain pytest without the coverage gate (handy for running a single test file).
test-fast = "pytest"
# Safety-critical core gate (rearchitecture plan §4.5): the edge_core/safety/
# package must hold 100% BRANCH coverage. Asymmetric rigor - the rest of the
# tree rides the modest 65% floor above; the SC core does not get to regress.
cov-safety = "pytest tests/test_safety_envelope.py tests/test_safety_gates.py tests/test_safety_limits.py tests/test_safety_watchdog.py tests/test_safety_geofence.py tests/test_safety_payload.py --cov=edge_core.safety --cov-branch --cov-report=term-missing --cov-fail-under=100"

# Hardware-free dev stack (Docker): Edge Core + ArduPilot SITL, no Isaac Sim.
#   pixi run dev-up      # build + start edge_core, SITL, and the MP bridge (detached)
#   pixi run test-api    # exercise every REST endpoint against it
#   pixi run dev-down    # stop and remove
# Mission Planner connects to SITL via TCP 127.0.0.1:5762 (the mp_bridge
# socat relay — 5760 is single-client and held by the in-container MAVProxy).
dev-build = "docker build -f docker/Dockerfile.dev -t nomad-edge-dev:latest ."
dev-up = "docker compose -f docker/docker-compose.dev.yml --profile sitl up -d --build"
dev-down = "docker compose -f docker/docker-compose.dev.yml --profile sitl down"
dev-logs = "docker compose -f docker/docker-compose.dev.yml logs -f"
dev-ps = "docker compose -f docker/docker-compose.dev.yml --profile sitl ps"
test-api = "python scripts/dev/test_api_endpoints.py"
# SITL loop-closure scenario for the safety-critical velocity core (needs the
# dev+sitl stack up: `pixi run dev-up`). Runs inside the compose network and
# mounts the working tree so it tests current code. See tests/sitl/README.md.
sitl-scenario = """docker run --rm --network nomad-dev_default -v $PWD:/work -w /work -e PYTHONPATH=/work -e NOMAD_SITL_OPERATOR=tcp:nomad-dev-sitl-1:5762 -e NOMAD_SITL_CONTROLLER=tcp:nomad-dev-sitl-1:5763 --entrypoint python nomad-edge-dev:latest tests/sitl/velocity_loop_closure.py"""
# Geofence containment scenario (SR-FEN-02): same stack, different script.
sitl-fence = """docker run --rm --network nomad-dev_default -v $PWD:/work -w /work -e PYTHONPATH=/work -e NOMAD_SITL_OPERATOR=tcp:nomad-dev-sitl-1:5762 -e NOMAD_SITL_CONTROLLER=tcp:nomad-dev-sitl-1:5763 --entrypoint python nomad-edge-dev:latest tests/sitl/geofence_containment.py"""
# Gimbal mount-control scenario: configures a servo mount on SITL, sends the
# same DO_MOUNT_CONTROL/DO_MOUNT_CONFIGURE commands the plugin emits, and asserts
# the mount points where commanded. Reboots the vehicle to apply MNT1_TYPE, so it
# runs LAST in the nightly sequence. Only needs the operator link.
sitl-gimbal = """docker run --rm --network nomad-dev_default -v $PWD:/work -w /work -e PYTHONPATH=/work -e NOMAD_SITL_OPERATOR=tcp:nomad-dev-sitl-1:5762 --entrypoint python nomad-edge-dev:latest tests/sitl/gimbal_mount_control.py"""
# ROS2 simulation stack (Tier 1 — CPU, no GPU/ZED/Jetson required).
#   pixi run sim-ros-build   # build the nomad-sim-ros:latest image (run once)
#   pixi run sim-ros-up      # start edge_core + ros_bridge + zed_sim (detached)
#   pixi run sim-ros-down    # stop and remove the ros-profile containers
#   pixi run sim-ros-logs    # tail logs from all ros-profile services
#   pixi run test-ros-integration  # end-to-end bridge integration test (needs sim-ros-build first)
sim-ros-build = "docker build -f docker/Dockerfile.sim-ros -t nomad-sim-ros:latest ."
sim-ros-down = "docker compose -p nomad-ros -f docker/docker-compose.dev.yml --profile ros down"
sim-ros-logs = "docker compose -p nomad-ros -f docker/docker-compose.dev.yml --profile ros logs -f"
# Runs the integration test INSIDE the sim-ros image (rclpy + pytest present in
# the image). Volume-mounts tests/ so the test suite is always current code.
# Exercises the REAL rclpy bridge node end-to-end against an in-process HTTP stub.
# Requires: pixi run sim-ros-build
test-ros-integration = """
docker run --rm -v $PWD/tests:/opt/nomad/tests nomad-sim-ros:latest python3 -m pytest tests/ros/ -v
"""
# ROS2 simulation stack (Tier 3 — ArduPilot SITL + visible Gazebo ZED-2i).
#   Visible by default: gz sim runs with its GUI on a virtual X display exposed
#   through noVNC at http://localhost:6080/vnc.html. No GPU is required; llvmpipe
#   software GL is used unless you attach an NVIDIA GPU. A ZED-2i-tuned Gazebo
#   camera publishes ZED-style ROS2 topics so the REAL ros_http_bridge is driven
#   by 3D physics simulation instead of synthetic math. Gazebo odometry drives
#   /zed/zed_node/odom; Edge Core's /api/vio/status reflects that odometry.
#
#   pixi run sim-gazebo-build  # build the nomad-sim-gazebo:latest image (run once)
#   pixi run sim-gazebo-up     # start edge_core + ros_bridge + visible gazebo
#   pixi run sim-gazebo-open   # open the noVNC Gazebo GUI in your browser
#   pixi run sim-gazebo-up-headless  # same stack with gz --headless-rendering
#   pixi run sim-gazebo-up-fast      # headless, lower camera load for RTF checks
#   pixi run sim-gazebo-down   # stop and remove the gazebo-profile containers
#   pixi run sim-gazebo-logs   # tail logs from all gazebo-profile services
#
# Depth: the gz depth camera publishes /zed/zed_node/depth/depth_registered +
# /zed/zed_node/point_cloud/cloud_registered (ground truth, no GPU required).
sim-gazebo-build = "docker build -f docker/Dockerfile.sim-gazebo -t nomad-sim-gazebo:latest ."
sim-gazebo-open = "python -m webbrowser http://localhost:6080/vnc.html"
sim-gazebo-down = "docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo down"
sim-gazebo-logs = "docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo logs -f"
sim-gazebo-ps = "docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo ps"

# These tasks only set env that differs from the compose `${VAR:-default}`
# defaults (see docker-compose.dev.yml). The shared perception/video wiring is
# what selects the profile; Gazebo/SITL tuning (verbosity, rate, synthetic
# clock, RTSP URL, default headless) already defaults to these values in compose.
"sim-ros-up".cmd = "docker compose -p nomad-ros -f docker/docker-compose.dev.yml --profile ros up -d --build"
"sim-ros-up".env.NOMAD_SIM_PERCEPTION_RUNTIME = "ros_sim"
"sim-ros-up".env.VIDEO_RELAY_HTTP_HOST = "video_bridge"
"sim-ros-up".env.NOMAD_VIDEO_EXTERNAL_BRIDGE = "1"

"sim-gazebo-up".cmd = "docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo up -d --build"
"sim-gazebo-up".env.NOMAD_SIM_PERCEPTION_RUNTIME = "gazebo"
"sim-gazebo-up".env.VIDEO_RELAY_HTTP_HOST = "video_bridge_gazebo"
"sim-gazebo-up".env.NOMAD_VIDEO_EXTERNAL_BRIDGE = "1"

"sim-gazebo-up-headless".cmd = """
docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo up -d --build
"""
"sim-gazebo-up-headless".env.NOMAD_GAZEBO_HEADLESS = "1"
"sim-gazebo-up-headless".env.NOMAD_SIM_PERCEPTION_RUNTIME = "gazebo"
"sim-gazebo-up-headless".env.VIDEO_RELAY_HTTP_HOST = "video_bridge_gazebo"
"sim-gazebo-up-headless".env.NOMAD_VIDEO_EXTERNAL_BRIDGE = "1"

"sim-gazebo-up-fast".cmd = """
docker compose -p nomad-gazebo -f docker/docker-compose.dev.yml --profile gazebo up -d --build
"""
"sim-gazebo-up-fast".env.NOMAD_GAZEBO_HEADLESS = "1"
"sim-gazebo-up-fast".env.NOMAD_GAZEBO_CAMERA_WIDTH = "160"
"sim-gazebo-up-fast".env.NOMAD_GAZEBO_CAMERA_HEIGHT = "90"
"sim-gazebo-up-fast".env.NOMAD_GAZEBO_CAMERA_FPS = "4"
"sim-gazebo-up-fast".env.NOMAD_GAZEBO_VERBOSITY = "1"
"sim-gazebo-up-fast".env.NOMAD_GAZEBO_MAX_STEP_SIZE = "0.002"
"sim-gazebo-up-fast".env.NOMAD_GAZEBO_REAL_TIME_UPDATE_RATE = "500"
"sim-gazebo-up-fast".env.NOMAD_SIM_PERCEPTION_RUNTIME = "gazebo"
"sim-gazebo-up-fast".env.VIDEO_RELAY_HTTP_HOST = "video_bridge_gazebo"
"sim-gazebo-up-fast".env.NOMAD_VIDEO_EXTERNAL_BRIDGE = "1"

lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
line-report = "python scripts/dev/line_report.py --fail-over-file-limit"
# Extra rule sets on the SC core + its adapters (rearchitecture plan §6):
# bugbear, bandit, logging-format, Ruff-specific. The rest of the tree rides
# the standard `lint` selection.
lint-safety = "ruff check --extend-select B,S,G,LOG,RUF edge_core/safety edge_core/ros_http_bridge/mavlink_velocity.py edge_core/services/mavlink/commands.py edge_core/modules/payload/servo.py"
# Whole-tree type check — advisory in CI (the bulk of the tree rides basic mypy).
typecheck = "mypy"
# SC core type gate: edge_core/safety carries the strict mypy overrides
# (disallow_untyped_defs et al., see [tool.mypy.overrides] in pyproject.toml) and,
# unlike the advisory whole-tree `typecheck`, this run is REQUIRED in CI — flight-
# decision code does not get to regress its types. Asymmetric rigor, mirroring
# `cov-safety` and `lint-safety`.
typecheck-safety = "mypy edge_core/safety"

# Documentation. Served on :8001 so it doesn't clash with `pixi run dev` (:8000).
docs = "properdocs serve --dev-addr localhost:8001"
docs-build = "properdocs build --strict"

# Git hooks
precommit = "pre-commit run --all-files"

# Bootstrap (run once when first cloning)
bootstrap = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup/bootstrap.ps1"

# Build the Mission Planner plugin (Windows only)
build-plugin = "powershell -ExecutionPolicy Bypass -File scripts/build/build_plugin_windows.ps1"

# Dead-code lint for the plugin (Windows only) — fails on unused fields/locals,
# unreachable code, etc. (C# compiler diagnostics promoted to errors).
lint-plugin = "powershell -ExecutionPolicy Bypass -File scripts/build/lint_plugin_deadcode.ps1"

# Unit tests for the plugin's geofence geometry (Windows only) — compiles the
# Mission Planner-free GeoMath/GeofenceTypes with VS's csc and runs assertions
# on polygon inset, point-in-polygon, and nearest-inside-point math.
test-plugin-geometry = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_geometry.ps1"

# Unit tests for the plugin's safety-critical payload-release interlock (Windows
# only) — compiles the Mission Planner-free PayloadReleaseInterlock with VS's csc
# and asserts the multi-click arm/confirm, rolling-window expiry, backwards-clock,
# and reset behaviour (the GCS counterpart of tests/test_safety_payload.py).
test-plugin-interlock = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_interlock.ps1"

# Unit tests for the gimbal command core (Windows only) — compiles the Mission
# Planner-free GimbalCommand with VS's csc and asserts the exact MAVLink it emits
# (DO_MOUNT_CONTROL/DO_MOUNT_CONFIGURE command ids + param layout, MAV_MOUNT_MODE
# values) plus the stick-integration and angle-clamping math. The autopilot side
# is exercised by tests/sitl/gimbal_mount_control.py (`pixi run sitl-gimbal`).
test-plugin-gimbal = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_gimbal.ps1"

# Unit tests for the host-independent flight-log analyzer and shared live issue rules.
test-plugin-logs = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_logs.ps1"

# Runtime smoke test for Mission Planner's DFLogBuffer adapter (requires a Release plugin build).
test-plugin-log-adapters = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_log_adapters.ps1"

# Stress/behaviour tests for the dual-link MAVLink router (Windows only) —
# compiles the Mission Planner-free GroundLinkRouter stack with VS's csc and
# runs it against real loopback UDP sockets: frame parsing, cross-link dedup,
# failover + preferred-link recovery, manual override, outbound single-link
# routing, param-transaction pinning, watchdog socket reopen, and high-rate
# mirrored stress with strict no-loss/no-duplication assertions.
test-plugin-duallink = "powershell -ExecutionPolicy Bypass -File scripts/build/test_plugin_duallink.ps1"

# ==================== Configuration Profiles ====================
# Manage config/nomad.env via named profiles stored in config/profiles/.
# Each profile is a complete environment file with all settings for a
# specific deployment target (real drone, minimal dev).
#
# Quick start:
#   pixi run profile-load drone     # Real Jetson + ZED2i
#   pixi run profile-load dev       # Minimal Edge Core only
#   pixi run profile-show           # Show active profile
#   pixi run profile-list           # List available profiles

# Cross-platform profile manager (runs in the pixi Python env so it works on
# Windows/macOS/Linux without bash). `nomad-profile` (bash) remains for the
# Jetson runtime.
profile-load = { cmd = "python scripts/profile.py load {{ profile }}", args = ["profile"] }
profile-save = { cmd = "python scripts/profile.py save {{ profile }}", args = ["profile"] }
profile-list = "python scripts/profile.py list"
profile-show = "python scripts/profile.py show"
profile-diff = { cmd = "python scripts/profile.py diff {{ profile }}", args = ["profile"] }
profile-edit = "python scripts/profile.py edit"
