# Development checks for the Mission Planner plugin; nothing here installs it.
[workspace]
name = "nomad"
version = "0.4.1"
description = "Mission Planner plugin development and documentation"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.13.*"
pre-commit = ">=3.8"

[pypi-dependencies]
ruff = "==0.15.16"
pytest = ">=8.0"
properdocs = ">=1.6"
mkdocs-material = ">=9.5"

[tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
test-python = "pytest"
docs = "properdocs serve --dev-addr localhost:8001"
docs-build = "properdocs build --strict"
precommit = "pre-commit run --all-files"
build-plugin-only = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/build_plugin_windows.ps1"
build-installer = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/build_plugin_installer.ps1"
test-plugin-installer = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_installer.ps1"
lint-plugin = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/lint_plugin_deadcode.ps1"
test-plugin-build-only = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_build_plugin_windows.ps1"
test-plugin-config-validation = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_config_validation.ps1"
test-aircraft-profiles = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_aircraft_profiles.ps1"
test-plugin-gimbal = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_gimbal.ps1"
test-plugin-payload = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_payload.ps1"
test-plugin-gimbal-ui = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_gimbal_ui.ps1"
test-plugin-ui = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_ui.ps1"
test-plugin-router-ui = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_router_ui.ps1"
test-plugin-video = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_video.ps1"

test-plugin-termination = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_termination.ps1"
test-plugin-geometry = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_geometry.ps1"
test-plugin-fence = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_fence.ps1"
test-plugin-audio = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_audio.ps1"
test-plugin-version = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_version.ps1"
test-ground-router-logic = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_ground_router.ps1"

# Manual installed-host simulator check; requires explicit source and DLL hash arguments.
test-plugin-native-sitl = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_native_sitl.ps1"

test-plugin-native-preflight = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/test_plugin_native_preflight.ps1"
