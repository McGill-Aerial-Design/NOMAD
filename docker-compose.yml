# ============================================================
# NOMAD Docker Compose -- Isaac ROS Container
#
# Only the Isaac ROS container runs in Docker. Everything else
# (Edge Core, MediaMTX, MAVLink Router) runs natively on the
# Jetson host as per-service systemd units. See:
#   infra/systemd/nomad-*.service     - one unit per NOMAD service
#   scripts/services/*.sh             - the script each unit runs
#   scripts/nomad                     - the unified CLI
#
# In production this compose file is NOT used to manage the lifecycle;
# nomad-isaac-ros-container.service owns the container. This compose file
# remains useful for `docker compose build` and ad-hoc local testing only.
#
# Prerequisites:
#   1. Build the official Isaac ROS dev base image first:
#        cd ~/workspaces/isaac_ros-dev/src/isaac_ros_common/scripts
#        ./build_image_layers.sh --image_key ros2_humble
#      This produces "isaac_ros_dev-aarch64".
#
#   2. Then build the NOMAD layer:
#        docker compose build isaac-ros
#
# Usage:
#   docker compose up -d                # Start container
#   docker compose exec isaac-ros bash  # Enter container
#   docker compose logs -f              # View logs
#   docker compose down                 # Stop
#
# Full setup guide: docs/ISAAC_ROS_NVBLOX_SETUP.md
# ============================================================

services:
  isaac-ros:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.isaac_ros_full
      args:
        BASE_IMAGE: isaac_ros_dev-aarch64
    image: nomad-isaac-ros:latest
    container_name: nomad_isaac_ros
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    privileged: true
    ipc: host
    # ============================================================
    # RESOURCE LIMITS (Jetson Orin Nano 8GB shared DRAM)
    # ============================================================
    # memory: "4g"
    #   Conservative allocation for Orin Nano shared DRAM model.
    #   Leaves ~4GB for host OS (ZED SDK, MediaMTX, system daemons).
    #   If host runs out of memory, kernel will OOM-kill processes.
    #   
    #   TO ENABLE: Uncomment the lines below and run:
    #     docker compose down && docker compose up -d
    #
    # cpus: "6"
    #   Leaves 2 cores (25% of 8-core ARM A78) for host system.
    #   nvblox + ZED + ROS2 typically use 4-6 cores under load.
    #
    # shm_size: "1g"
    #   Limits /dev/shm for IPC (FastRTPS zero-copy transports).
    #   Default 8GB on Orin Nano; reduced to 1GB to prevent
    #   unintended shared memory bloat from dropped ROS2 messages.
    #
    # See docs/JETSON_DEPLOYMENT.md § Resource Requirements
    # ============================================================
    # UNCOMMENT BELOW TO ENFORCE LIMITS (requires careful testing)
    # memory: "4g"
    # cpus: "6"
    # shm_size: "1g"
    volumes:
      # Isaac ROS workspace (source + build artifacts persist here on host)
      # CRITICAL: This mount does NOT override /opt/isaac_ros_installed (container layer)
      # The pre-built isaac_ros_nvblox_utils package in /opt/isaac_ros_installed persists
      # independently and is always available via ROS_PACKAGE_PATH overlay.
      - /home/mad/workspaces/isaac_ros-dev:/workspaces/isaac_ros-dev
      # ZED SDK runtime libraries (required for camera initialization)
      - /usr/local/zed:/usr/local/zed:ro
      # Device access
      - /dev:/dev
      # udev database (required for ZED SDK USB device detection)
      - /run/udev:/run/udev:ro
      # X11 display (for RViz if needed)
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Argus camera socket
      - /tmp/argus_socket:/tmp/argus_socket
      # Timezone
      - /etc/localtime:/etc/localtime:ro
      # NOMAD configs (nvblox_performance.yaml, etc.)
      - ./config:/workspaces/isaac_ros-dev/config:ro
      # Edge core scripts (ros_http_bridge, etc.)
      - ./edge_core:/workspaces/isaac_ros-dev/edge_core:ro
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - CUDA_HOME=/usr/local/cuda
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/zed/lib
      # Headless EGL for ZED SDK GPU access (no display needed)
      - EGL_PLATFORM=device
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: >
      bash -c "
        echo '[init] Cleaning up old ROS processes...';
        pkill -f 'controller_server|planner_server|nav2' 2>/dev/null || true;
        sleep 1;

        echo '[init] Binding uvcvideo driver to ZED camera...';
        for dev in /sys/bus/usb/devices/*/idVendor; do
          dir=$$(dirname $$dev);
          vid=$$(cat $$dev 2>/dev/null);
          if [ \"$$vid\" = \"2b03\" ]; then
            for iface in $$dir/*:*/bInterfaceClass; do
              idir=$$(dirname $$iface);
              cls=$$(cat $$iface 2>/dev/null);
              iname=$$(basename $$idir);
              if [ \"$$cls\" = \"0e\" ] && [ ! -e $$idir/driver ]; then
                echo \"[init] Binding uvcvideo to $$iname (Video class)\";
                echo $$iname > /sys/bus/usb/drivers/uvcvideo/bind 2>/dev/null || true;
              fi;
            done;
          fi;
        done;
        sleep 1;
        ls /dev/video* 2>/dev/null && echo '[init] Video devices ready.' || echo '[init] Warning: No /dev/video devices found.';
        source /opt/ros/humble/setup.bash 2>/dev/null;
        source /workspaces/isaac_ros-dev/install/setup.bash 2>/dev/null || true;
        export LD_LIBRARY_PATH=/usr/local/zed/lib:$$LD_LIBRARY_PATH;

        echo '[init] Building target_localizer ROS 2 package...';
        cp -r /workspaces/isaac_ros-dev/edge_core/target_localizer /tmp/target_localizer_src;
        cd /tmp && colcon build --paths target_localizer_src --install-base /opt/target_localizer_install 2>&1 | tail -5;
        source /opt/target_localizer_install/setup.bash 2>/dev/null || true;
        cd /workspaces/isaac_ros-dev;

        echo '[init] Isaac ROS container ready.';

        # NOTE: Do NOT patch pub_downscale_factor to 1.0.
        # 360p (downscale 2.0) prevents cudaErrorIllegalAddress on 8GB Orin Nano.

        echo '[init] Launching nvblox via NOMAD wrapper (nav2 disabled by default)...';
        ros2 launch /workspaces/isaac_ros-dev/config/launch/nomad_zed_nvblox.launch.py \
          enable_nav2:=false nvblox_params_file:=/workspaces/isaac_ros-dev/config/nvblox_performance.yaml > /tmp/zed_nvblox.log 2>&1 &
        NVBLOX_PID=$$!;
        echo $$NVBLOX_PID > /tmp/zed_nvblox.pid;

        echo '[init] Waiting for ZED topics before starting bridge...';
        ZED_READY=false;
        for i in $$(seq 1 30); do
          if ros2 topic list 2>/dev/null | grep -q 'zed.*image' && \
             ros2 topic list 2>/dev/null | grep -q 'zed.*odom'; then
            echo "[init] ZED camera and odometry ready after $${i} iterations";
            ZED_READY=true;
            break;
          fi;
          echo "[init] Waiting for ZED topics... ($$i/30)";
          sleep 2;
        done;

        if [ "$$ZED_READY" = "false" ]; then
          echo '[init] ERROR: ZED not ready after 60 seconds. Check camera connection.';
          kill $$NVBLOX_PID 2>/dev/null || true;
          exit 1;
        fi;

        echo '[init] Note: Video bridge is launched by nomad-video-bridge.service (single owner; calls Edge Core /api/video/start).';
        echo '[init] Note: ros_http_bridge is launched by nomad-ros-http-bridge.service (single owner; restart loop is in scripts/services/ros_http_bridge.sh).';

        echo '[init] Launching drone state publisher (Edge Core -> ROS topics for target_localizer)...';
        python3 /workspaces/isaac_ros-dev/edge_core/ros/drone_state_publisher.py --host localhost --port 8000 --rate 10 > /tmp/drone_state_pub.log 2>&1 &
        DRONE_STATE_PID=$$!;
        echo $$DRONE_STATE_PID > /tmp/drone_state_pub.pid;

        echo '[init] Launching target_localizer node...';
        ros2 launch target_localizer target_localizer.launch.py > /tmp/target_localizer.log 2>&1 &
        TARGET_LOC_PID=$$!;
        echo $$TARGET_LOC_PID > /tmp/target_localizer.pid;

        echo '[init] All services launched.';
        wait -n $$NVBLOX_PID $$DRONE_STATE_PID $$TARGET_LOC_PID 2>/dev/null || wait $$NVBLOX_PID;
          echo '[init] Process exited, container will restart';
      "
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/humble/setup.bash 2>/dev/null; ros2 topic list 2>/dev/null | grep -q zed && curl -sf http://localhost:8000/api/health && [ -f /tmp/ros_bridge.pid ] && kill -0 $(cat /tmp/ros_bridge.pid) 2>/dev/null && [ -f /tmp/drone_state_pub.pid ] && kill -0 $(cat /tmp/drone_state_pub.pid) 2>/dev/null || exit 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ============================================================
  # Host-side services (NOT containerized) — each managed by its own
  # systemd unit (infra/systemd/nomad-*.service):
  #   - Edge Core API:    nomad-edge-core.service          (port 8000)
  #   - MediaMTX:         nomad-mediamtx.service           (port 8554)
  #   - MAVLink Router:   nomad-mavlink-router.service     (port 14550)
  #   - Video Bridge:     nomad-video-bridge.service       (calls /api/video/start)
  #   - Tailscale VPN:    tailscaled.service               (system package)
  # ============================================================
