# ============================================================
# NOMAD Docker Compose - Isaac ROS Architecture
# 
# This compose file recreates the production Isaac ROS setup for Jetson Orin Nano.
# Used for: recovery, fresh deployment, or development.
#
# Prerequisites:
# - Jetson Orin Nano with JetPack 6.2
# - ZED2i camera connected
# - Cube Orange connected via USB (/dev/ttyACM0)
#
# Usage:
#   docker compose up -d isaac-ros    # Start Isaac ROS container
#   docker compose logs -f            # View logs
#   docker compose exec isaac-ros bash # Enter container
#   docker compose down               # Stop all
#
# Alternative: Start individual services
#   docker compose up -d mediamtx     # Video streaming only
#
# Profiles:
#   docker compose --profile edge-api up    # Include Edge Core HTTP API
#   docker compose --profile mavlink up     # Include MAVLink Router
# ============================================================

services:
  # ============================================================
  # Isaac ROS Container - Main Navigation Stack
  # Container: nomad_isaac_ros
  # 
  # Contains:
  # - ZED ROS2 wrapper (VIO at 30Hz)
  # - MAVROS connected to Cube Orange via /dev/ttyACM0:921600
  # - vio_bridge.py for VIO -> MAVLink forwarding
  # - Nav2 stack (for autonomous navigation)
  # - nvblox (for 3D mapping)
  # ============================================================
  isaac-ros:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.isaac_ros_full
    image: nomad-isaac-ros:latest
    container_name: nomad_isaac_ros
    restart: unless-stopped
    runtime: nvidia  # NVIDIA Container Runtime for GPU
    network_mode: host
    privileged: true
    ipc: host  # Shared memory for ROS2 DDS
    volumes:
      # Device access
      - /dev:/dev
      # ZED SDK is installed INSIDE the container by start_isaac_ros_auto.sh
      # to avoid CUDA version mismatch with host SDK.
      # Do NOT mount /usr/local/zed from the host.
      # NOMAD configs
      - ./config:/workspaces/isaac_ros-dev/config:ro
      # VIO bridge and ROS files
      - ./edge_core/ros:/workspaces/isaac_ros-dev/nomad_ros:ro
      # NVMe storage for recordings and data
      - /mnt/nvme:/mnt/nvme
      # ROS logs
      - ~/.ros:/root/.ros
    environment:
      # ROS2 settings
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspaces/isaac_ros-dev/config/fastdds.xml
      # CUDA
      - CUDA_HOME=/usr/local/cuda
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/zed/lib:/opt/ros/humble/lib:/opt/ros/humble/install/lib:$LD_LIBRARY_PATH
      # MAVROS FCU connection
      - FCU_URL=/dev/ttyACM0:921600
    devices:
      - /dev/video0:/dev/video0  # ZED camera
      - /dev/ttyACM0:/dev/ttyACM0  # Cube Orange
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash 2>/dev/null;
        source /opt/ros/humble/install/setup.bash &&
        source /workspaces/isaac_ros-dev/install/setup.bash 2>/dev/null || true &&
        echo 'Isaac ROS container ready. Run your launch files.' &&
        tail -f /dev/null
      "
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/humble/setup.bash 2>/dev/null; source /opt/ros/humble/install/setup.bash 2>/dev/null; ros2 topic list > /dev/null 2>&1 || exit 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ============================================================
  # MediaMTX - Video Streaming Server (Host-side)
  # Provides RTSP streams for Mission Planner video feed
  # ============================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: nomad-mediamtx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
      - /mnt/nvme/recordings:/mnt/nvme/recordings
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Jetson Video Streamer - Hardware-Accelerated RTSP Streaming
  # Minimal container with Jetson HW encoder (nvv4l2h264enc)
  # Uses dedicated hw encoder chip - zero extra resources
  # ============================================================
  jetson-video-stream:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.jetson_video
    image: nomad-jetson-video:latest
    container_name: nomad-jetson-video
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    privileged: true
    ipc: host
    depends_on:
      mediamtx:
        condition: service_started
    volumes:
      - /dev:/dev
      - ./edge_core/ros:/workspace/ros:ro
      - ~/.ros:/root/.ros
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - VIDEO_SOURCE_TOPIC=/zed/zed_node/rgb/image_rect_color
      - RTSP_URL=rtsp://localhost:8554/primary
      - VIDEO_WIDTH=1280
      - VIDEO_HEIGHT=720
      - VIDEO_BITRATE=4000000
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        python3 /workspace/ros/jetson_video_bridge.py \
          --source-topic $${VIDEO_SOURCE_TOPIC} \
          --rtsp-url $${RTSP_URL} \
          --width $${VIDEO_WIDTH} \
          --height $${VIDEO_HEIGHT} \
          --bitrate $${VIDEO_BITRATE}
      "
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f jetson_video_bridge || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================
  # Edge Core API (Optional - for HTTP API access)
  # Only needed if running Edge Core outside Isaac container
  # ============================================================
  edge-core:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: jetson-runtime
    image: nomad-edge-core:latest
    container_name: nomad-edge-core
    restart: unless-stopped
    network_mode: host
    privileged: true
    profiles: ["edge-api"]  # Only start with: docker compose --profile edge-api up
    depends_on:
      isaac-ros:
        condition: service_healthy
    volumes:
      - /dev:/dev
      - /mnt/nvme:/mnt/nvme
      - ./config:/app/config:ro
    environment:
      - NOMAD_LOG_LEVEL=INFO
      - NOMAD_SIM_MODE=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================
  # MAVLink Router - Message Routing (Optional)
  # Use when Isaac ROS MAVROS is not handling MAVLink
  # ============================================================
  mavlink-router:
    image: tiiuae/mavlink-router:latest
    container_name: nomad-mavlink-router
    restart: unless-stopped
    network_mode: host
    privileged: true
    profiles: ["mavlink"]  # Only start with: docker compose --profile mavlink up
    volumes:
      - ./transport/mavlink_router/main.conf:/etc/mavlink-router/main.conf:ro
      - /dev:/dev
    command: ["-c", "/etc/mavlink-router/main.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep mavlink-routerd || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# ============================================================
# Volumes
# ============================================================
volumes:
  nvme-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/nvme
