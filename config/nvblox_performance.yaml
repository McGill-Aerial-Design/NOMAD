# ==============================================================
# NOMAD nvblox Configuration
#
# Tuned for Jetson Orin Nano (8GB shared CPU+GPU RAM)
# 10cm voxels, 2D ESDF, dynamic mapping, 5m radius
#
# IMPORTANT: ZED + nvblox share 8GB GPU memory. To prevent
# cudaErrorIllegalAddress crashes:
# - Use blocking CUDA stream (type 0) for sequential GPU access
# - Disable color integration (saves ~30% GPU memory)
# - Keep depth at 360p (pub_downscale_factor: 2.0 default)
# - Use 5m radius (not 8m) to reduce active voxel count
# ==============================================================

/**:
  ros__parameters:
    # CUDA stream: 0=blocking (sequential GPU access, prevents CUDA conflicts)
    # Type 2 (non-blocking) causes cudaErrorIllegalAddress when ZED + nvblox
    # compete for GPU memory on 8GB shared RAM
    cuda_stream_type: 0

    # ==============================================================
    # VOXEL SIZE - 10cm for decimeter precision (Task 1 + Task 2)
    # Increase to 0.20 only if GPU memory becomes a problem.
    # Use nvblox_indoor.yaml (3cm voxels) for fine doorway navigation.
    # ==============================================================
    voxel_size: 0.10  # 10cm voxels — decimeter precision

    # dynamic: depth-based dynamic object detection (people, vehicles)
    # static_tsdf crashes with cudaErrorIllegalAddress on Jetson Orin Nano
    mapping_type: "dynamic"

    # 3D ESDF — required for drone 3D collision checks (variable altitude,
    # overhead obstacles, low tables). ~2x voxel memory vs 2D mode.
    esdf_mode: "3d"

    # ==============================================================
    # RATE SETTINGS — conservative for 8GB Orin Nano
    # Lower rates reduce GPU memory pressure from queued frames
    # ==============================================================
    tick_period_ms: 50
    integrate_depth_rate_hz: 5.0     # conservative depth integration
    # Color integration must match depth/mesh rate or color_layer_marker
    # voxels flash in/out at the color cadence. Was 1.0 — produced a visible
    # 1 Hz thrash in RViz because the color layer lagged depth by 4 frames.
    integrate_color_rate_hz: 5.0     # matches depth/mesh; prevents marker flicker
    integrate_lidar_rate_hz: 0.0
    update_mesh_rate_hz: 5.0         # balanced mesh update cadence for lower CPU
    update_esdf_rate_hz: 5.0         # balanced ESDF updates for obstacle avoidance
    publish_layer_rate_hz: 5.0
    publish_debug_vis_rate_hz: 1.0
    decay_tsdf_rate_hz: 2.0          # >0 enables time-based map decay (old detections fade)
    decay_dynamic_occupancy_rate_hz: 2.0
    clear_map_outside_radius_rate_hz: 1.0

    # Global frame: map (stable under ZED loop-closure corrections).
    # nvblox defaults to "odom" which drifts when ZED area memory publishes
    # map->odom corrections — the map frame is fixed and correction-safe.
    global_frame: "map"

    # Misc
    num_cameras: 1
    use_tf_transforms: true

    # Reduce console output
    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 30000

    # ==============================================================
    # ESDF Settings (2D slice)
    # ==============================================================
    publish_esdf_distance_slice: true

    # ==============================================================
    # Color enabled — needed for mesh vertex generation in nvblox.
    # Mesh marching cubes requires color integration to tag vertices.
    # ==============================================================
    use_color: true
    use_depth: true
    use_lidar: false

    # Input queue - minimal to reduce GPU memory pressure
    maximum_input_queue_length: 3

    # ==============================================================
    # Map clearing - 8m radius around base_link
    # Voxels outside this radius are continuously cleared.
    # ==============================================================
    map_clearing_radius_m: 8.0
    map_clearing_frame_id: "base_link"

    # QoS settings
    input_qos: "SYSTEM_DEFAULT"

    # Visualization - 5m view area
    esdf_slice_bounds_visualization_side_length: 5.0
    workspace_height_bounds_visualization_side_length: 5.0
    layer_visualization_exclusion_height_m: 50.0
    layer_visualization_exclusion_radius_m: 5.0
    layer_visualization_min_tsdf_weight: 0.0001
    max_back_projection_distance: 5.0
    back_projection_subsampling: 4
    # Negative value = unlimited. nvblox's layer_streamer uses a bandwidth
    # budget to decide how many dirty blocks it streams per publish tick.
    # Any positive cap (even large) causes the color_layer_marker topic to
    # become incremental, which is broken with stock RViz (stateless Marker
    # display replaces rather than accumulates). For the plugin topics
    # (/nvblox_node/mesh, /nvblox_node/color_layer) this simply maximizes
    # throughput. See nvblox layer_streamer_impl.h.
    layer_streamer_bandwidth_limit_mbps: -1.0

    # Multi-mapper settings
    multi_mapper:
      connected_mask_component_size_threshold: 2000
      remove_small_connected_components: true

    # Static mapper (background layer in dynamic mode)
    static_mapper:
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 1

      # Integration distances - 5m range
      projective_integrator_max_integration_distance_m: 5.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 10.0
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0

      # Occupancy settings
      free_region_occupancy_probability: 0.45
      occupied_region_occupancy_probability: 0.55
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.12

      # View calculator - aggressive subsampling for speed
      raycast_subsampling_factor: 8

      # Workspace bounds
      workspace_bounds_type: "height_bounds"
      workspace_bounds_min_height_m: -5.0
      workspace_bounds_max_height_m: 5.0

      # ESDF integrator
      esdf_integrator_min_weight: 0.5
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0

      # Mesh - triangle surface generation (streamed to Mission Planner)
      # Must be high enough that low-confidence voxels don't appear/disappear
      # on every decay cycle (previous value 0.0001 caused visible flicker in
      # color_layer_marker — blocks popped in on integration then vanished on
      # the next decay tick).
      mesh_integrator_min_weight: 0.1
      mesh_integrator_weld_vertices: true

      # Decay - softened to prevent block thrash
      # Previous config (0.95 factor + 0.001 threshold + deallocate) caused
      # blocks just outside the camera frustum to oscillate: their weight
      # decayed below threshold in ~1s, the deallocator removed them, and the
      # next depth frame re-allocated them. Keep decayed blocks around (dim
      # rather than vanish) and decay more gently.
      tsdf_decay_factor: 0.98
      tsdf_decayed_weight_threshold: 0.001
      exclude_last_view_from_decay: true
      tsdf_set_free_distance_on_decayed: false
      tsdf_decayed_free_distance_vox: 4.0
      decay_integrator_deallocate_decayed_blocks: false

      # Streaming - 5m radius
      layer_streamer_exclusion_height_m: 50.0
      layer_streamer_exclusion_radius_m: 5.0

    # Dynamic mapper (moving-object layer in dynamic mode).
    # In dynamic mapping_type, nvblox classifies each voxel as static or
    # dynamic every cycle. Border voxels (ZED depth noise, VIO jitter) flip
    # classifications, so any aggressive decay / deallocate on the dynamic
    # side causes the voxel to vanish → reappear → vanish on the
    # color_layer_marker topic. Mirror the static_mapper decay tuning so
    # misclassified voxels don't thrash.
    dynamic_mapper:
      projective_integrator_max_integration_distance_m: 5.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 10.0

      mesh_integrator_min_weight: 0.1
      mesh_integrator_weld_vertices: true

      tsdf_decay_factor: 0.98
      tsdf_decayed_weight_threshold: 0.001
      exclude_last_view_from_decay: true
      decay_integrator_deallocate_decayed_blocks: false
