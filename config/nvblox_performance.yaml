# ==============================================================
# NOMAD nvblox 3D LOW-LATENCY Configuration
# 
# Optimized for SPEED + 3D on Jetson Orin Nano (8GB shared RAM)
# 10cm voxels, 8m radius to stay within GPU memory budget
# ==============================================================

/**:
  ros__parameters:
    # CUDA stream setting - non-blocking for lower latency
    cuda_stream_type: 2

    # ==============================================================
    # VOXEL SIZE - 5cm for indoor navigation accuracy
    # Memory managed via 8m radius + block deallocation
    # ==============================================================
    voxel_size: 0.05  # 5cm voxels
    
    # static_tsdf for 3D mesh generation
    mapping_type: "static_tsdf"
    
    # 3D ESDF for full volumetric mapping
    esdf_mode: "3d"

    # ==============================================================
    # SPEED SETTINGS with 3D enabled
    # Conservative rates to stay within Orin Nano budget
    # ==============================================================
    tick_period_ms: 10
    integrate_depth_rate_hz: 10.0    # reduced from 15 - less GPU pressure
    integrate_color_rate_hz: 5.0     # reduced from 10 - color is optional
    integrate_lidar_rate_hz: 0.0
    update_mesh_rate_hz: 2.0         # reduced from 5 - mesh is viz only
    update_esdf_rate_hz: 5.0         # reduced from 10 - still responsive
    publish_layer_rate_hz: 5.0       # reduced from 10
    publish_debug_vis_rate_hz: 1.0   # reduced from 2
    decay_tsdf_rate_hz: 1.0          # slow decay to free old blocks
    decay_dynamic_occupancy_rate_hz: 0.0
    clear_map_outside_radius_rate_hz: 1.0  # more aggressive map clearing

    # Misc
    num_cameras: 1
    use_tf_transforms: true
    
    # Reduce console output
    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 30000

    # ==============================================================
    # ESDF Settings (3D volumetric)
    # ==============================================================
    publish_esdf_distance_slice: true
    
    # ==============================================================
    # 3D visualization enabled
    # ==============================================================
    use_color: true   # enable color for 3D mesh
    use_depth: true   # required for mapping
    use_lidar: false

    # Input queue - minimal for low latency
    maximum_input_queue_length: 2  # minimal buffering

    # ==============================================================
    # Map clearing - 8m radius around drone (fits in GPU memory)
    # ==============================================================
    map_clearing_radius_m: 8.0  # 8m radius - prevents GPU OOM
    map_clearing_frame_id: "base_link"

    # QoS settings
    input_qos: "SYSTEM_DEFAULT"

    # Visualization - 8m view area
    esdf_slice_bounds_visualization_side_length: 8.0
    workspace_height_bounds_visualization_side_length: 8.0
    layer_visualization_exclusion_height_m: 3.0
    layer_visualization_exclusion_radius_m: 8.0
    max_back_projection_distance: 8.0
    back_projection_subsampling: 4  # heavy subsampling for speed
    layer_streamer_bandwidth_limit_mbps: 30.0

    # Multi-mapper settings
    multi_mapper:
      connected_mask_component_size_threshold: 2000
      remove_small_connected_components: true

    # Static mapper - STABLE 3D mapping settings
    static_mapper:
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 1
      
      # Integration distances - 8m range (fits GPU memory)
      projective_integrator_max_integration_distance_m: 8.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 10.0
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0
      
      # Occupancy settings
      free_region_occupancy_probability: 0.45
      occupied_region_occupancy_probability: 0.55
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.12
      
      # View calculator
      raycast_subsampling_factor: 8
      
      # Workspace bounds
      workspace_bounds_type: "height_bounds"
      workspace_bounds_min_height_m: -0.5
      workspace_bounds_max_height_m: 2.5
      
      # ESDF integrator
      esdf_integrator_min_weight: 0.5
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0
      
      # Mesh - STABLE settings
      mesh_integrator_min_weight: 1.0
      mesh_integrator_weld_vertices: true
      
      # Decay - enable to free GPU memory for old blocks
      tsdf_decay_factor: 0.95  # moderate decay to reclaim memory
      tsdf_decayed_weight_threshold: 0.001
      exclude_last_view_from_decay: true
      tsdf_set_free_distance_on_decayed: false
      tsdf_decayed_free_distance_vox: 4.0
      decay_integrator_deallocate_decayed_blocks: true  # FREE old blocks to prevent OOM
      
      # Streaming - 8m radius
      layer_streamer_exclusion_height_m: 3.0
      layer_streamer_exclusion_radius_m: 8.0
