# ==============================================================
# NOMAD nvblox 3D LOW-LATENCY Configuration
# 
# Optimized for SPEED + 3D on Jetson Orin Nano (8GB RAM)
# Larger voxels, 3D ESDF, mesh enabled at reduced rate
# ==============================================================

/**:
  ros__parameters:
    # CUDA stream setting - non-blocking for lower latency
    cuda_stream_type: 2

    # ==============================================================
    # VOXEL SIZE - LARGER = FASTER (less computation)
    # ==============================================================
    voxel_size: 0.12  # 12cm voxels - balance speed/resolution
    
    # static_tsdf for 3D mesh generation
    mapping_type: "static_tsdf"
    
    # 3D ESDF for full volumetric mapping
    esdf_mode: "3d"

    # ==============================================================
    # SPEED SETTINGS with 3D enabled
    # ==============================================================
    tick_period_ms: 10
    integrate_depth_rate_hz: 30.0
    integrate_color_rate_hz: 15.0  # reduced color for some visualization
    integrate_lidar_rate_hz: 0.0
    update_mesh_rate_hz: 10.0      # stable mesh rate
    update_esdf_rate_hz: 15.0      # ESDF rate
    publish_layer_rate_hz: 15.0
    publish_debug_vis_rate_hz: 5.0
    decay_tsdf_rate_hz: 0.0        # DISABLE TSDF decay - causes flashing
    decay_dynamic_occupancy_rate_hz: 0.0  # DISABLE dynamic decay
    clear_map_outside_radius_rate_hz: 0.5 # slow map clearing

    # Misc
    num_cameras: 1
    use_tf_transforms: true
    
    # Reduce console output
    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 30000

    # ==============================================================
    # ESDF Settings (3D volumetric)
    # ==============================================================
    publish_esdf_distance_slice: true
    
    # ==============================================================
    # 3D visualization enabled
    # ==============================================================
    use_color: true   # enable color for 3D mesh
    use_depth: true   # required for mapping
    use_lidar: false

    # Input queue - minimal for low latency
    maximum_input_queue_length: 2  # minimal buffering

    # ==============================================================
    # Map clearing - 15m radius around drone
    # ==============================================================
    map_clearing_radius_m: 15.0  # 15m radius for saved area
    map_clearing_frame_id: "base_link"

    # QoS settings
    input_qos: "SYSTEM_DEFAULT"

    # Visualization - 15m view area
    esdf_slice_bounds_visualization_side_length: 15.0
    workspace_height_bounds_visualization_side_length: 15.0
    layer_visualization_exclusion_height_m: 3.0
    layer_visualization_exclusion_radius_m: 15.0
    max_back_projection_distance: 10.0
    back_projection_subsampling: 4  # heavy subsampling for speed
    layer_streamer_bandwidth_limit_mbps: 30.0  # higher limit for larger map

    # Multi-mapper settings
    multi_mapper:
      connected_mask_component_size_threshold: 2000
      remove_small_connected_components: true

    # Static mapper - STABLE 3D mapping settings
    static_mapper:
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 1
      
      # Integration distances - 15m range
      projective_integrator_max_integration_distance_m: 15.0
      projective_integrator_truncation_distance_vox: 4.0  # larger = more stable
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 10.0  # HIGHER weight = more stable map
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0  # disable invalid decay
      
      # Occupancy settings
      free_region_occupancy_probability: 0.45
      occupied_region_occupancy_probability: 0.55
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.12
      
      # View calculator
      raycast_subsampling_factor: 8  # moderate subsampling
      
      # Workspace bounds
      workspace_bounds_type: "height_bounds"
      workspace_bounds_min_height_m: -0.5
      workspace_bounds_max_height_m: 2.5
      
      # ESDF integrator
      esdf_integrator_min_weight: 0.5  # require more weight before showing
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0
      
      # Mesh - STABLE settings
      mesh_integrator_min_weight: 1.0  # HIGHER = only show confident voxels
      mesh_integrator_weld_vertices: true
      
      # MINIMAL DECAY - for stable map (value MUST be < 1.0)
      tsdf_decay_factor: 0.99  # very slow decay
      tsdf_decayed_weight_threshold: 0.001  # high threshold before decay kicks in
      exclude_last_view_from_decay: true
      tsdf_set_free_distance_on_decayed: false
      tsdf_decayed_free_distance_vox: 4.0
      decay_integrator_deallocate_decayed_blocks: false  # keep blocks in memory
      
      # Streaming - 15m radius
      layer_streamer_exclusion_height_m: 3.0
      layer_streamer_exclusion_radius_m: 15.0
