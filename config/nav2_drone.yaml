# ==============================================================
# NOMAD Nav2 Configuration for Omnidirectional Drone
#
# Tricopter tiltrotor VTOL in copter mode (omnidirectional hover)
# Uses nvblox ESDF costmap for 2D obstacle avoidance at flight altitude
# Altitude is managed separately by mission planning / Edge Core
#
# Nav2 generates /cmd_vel -> ros_http_bridge -> NavController -> ArduPlane GUIDED
# ==============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    # Shorter timeout - drone shouldn't hang
    bt_loop_duration: 10
    default_server_timeout: 15
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      # Ground-robot-only behaviors removed:
      # - nav2_spin_action_bt_node (drone doesn't need to spin to unstick)
      # - nav2_back_up_action_bt_node (drone can strafe)
      # - nav2_drive_on_heading_bt_node
      # - nav2_assisted_teleop_action_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ==============================================================
# CONTROLLER - MPPI with Omni motion model for multicopter
# ==============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0  # 10 Hz - balanced for Jetson load
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0  # longer - drone may hover waiting

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30  # 30cm tolerance for indoor drone
      yaw_goal_tolerance: 0.40  # ~23 deg yaw tolerance
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.1            # 4 second horizon (40 * 0.1)
      batch_size: 1000         # reduced for Jetson GPU budget
      vx_std: 0.15
      vy_std: 0.15             # omni: lateral noise
      wz_std: 0.3
      vx_max: 1.5              # max forward speed (m/s) indoor
      vx_min: -1.5             # omni: can fly backwards equally
      vy_max: 1.5              # omni: full lateral capability
      wz_max: 1.5              # yaw rate limit (rad/s)
      iteration_count: 1
      prune_distance: 2.0
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"     # omnidirectional - drone can move any direction
      visualize: false
      reset_period: 1.0
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # Critics tuned for omnidirectional drone
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.2

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 6.0       # higher than ground robot - drone crash = bad
        critical_weight: 30.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.15  # 15cm safety margin
        near_goal_distance: 0.5
        inflation_radius: 0.6
        cost_scaling_factor: 10.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2

      # Minimize unnecessary yaw rotation (save battery, reduce VIO drift)
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

      # No PreferForwardCritic - drone is omnidirectional

# ==============================================================
# LOCAL COSTMAP - rolling window around drone, nvblox ESDF
# ==============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      footprint_padding: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8              # 8m x 8m - matches nvblox map clearing radius
      height: 8
      resolution: 0.05      # 5cm - matches nvblox voxel size
      transform_tolerance: 0.3
      # Drone footprint: ~60cm diameter circle approximated as octagon
      footprint: "[ [0.30, 0.0], [0.21, 0.21], [0.0, 0.30], [-0.21, 0.21], [-0.30, 0.0], [-0.21, -0.21], [0.0, -0.30], [0.21, -0.21] ]"
      mark_threshold: 2
      always_send_full_costmap: true
      plugins: ['nvblox_layer', 'inflation_layer']

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: "/nvblox_node/combined_dynamic_map_slice"
        convert_to_binary_costmap: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 5.0     # gentler falloff - drone needs wider clearance
        inflation_radius: 1.0        # 1m inflation for safety

# ==============================================================
# GLOBAL COSTMAP - larger rolling window, no pre-built map
# nvblox builds the map as the drone explores
# ==============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      footprint_padding: 0.0
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: odom           # ZED VIO odom frame (no separate map frame)
      robot_base_frame: base_link
      rolling_window: true         # no pre-built map - rolling window from nvblox
      width: 30                    # 30m x 30m global view
      height: 30
      resolution: 0.10             # 10cm global - coarser for performance
      transform_tolerance: 0.5
      footprint: "[ [0.30, 0.0], [0.21, 0.21], [0.0, 0.30], [-0.21, 0.21], [-0.30, 0.0], [-0.21, -0.21], [0.0, -0.30], [0.21, -0.21] ]"
      track_unknown_space: true    # important for exploration
      mark_threshold: 2
      always_send_full_costmap: false
      plugins: ['nvblox_layer', 'inflation_layer']

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: "/nvblox_node/combined_dynamic_map_slice"
        convert_to_binary_costmap: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 5.0
        inflation_radius: 1.0

# ==============================================================
# PLANNER - Smac 2D for omnidirectional planning (no turning radius)
# ==============================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0  # replan every 0.5s
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25                # 25cm goal tolerance
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true            # drone explores unknown areas
      max_iterations: 500000
      max_on_approach_iterations: 500
      max_planning_time: 3.0         # 3s max planning time
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true
      smoother:
        max_iterations: 500
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ==============================================================
# SMOOTHER
# ==============================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ==============================================================
# BEHAVIOR SERVER - drone-appropriate recovery behaviors only
# ==============================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Drone recovery: wait in place (hover). No spin/backup.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 2.0

# ==============================================================
# WAYPOINT FOLLOWER - for multi-waypoint missions
# ==============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true          # drone should stop on nav failure
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 500  # 500ms pause at each waypoint

# ==============================================================
# VELOCITY SMOOTHER - smooth cmd_vel for stable flight
# ==============================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [vx, vy, wz] - omnidirectional drone limits
    max_velocity: [1.5, 1.5, 1.5]
    min_velocity: [-1.5, -1.5, -1.5]
    max_accel: [1.0, 1.0, 1.5]     # gentle accel for stable flight
    max_decel: [-1.0, -1.0, -1.5]
    odom_duration: 0.1
    deadband_velocity: [0.05, 0.05, 0.05]
    velocity_timeout: 1.0           # stop if no command for 1s
