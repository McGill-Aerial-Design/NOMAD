# ==============================================================
# NOMAD nvblox INDOOR Configuration (NV-003)
#
# Optimized for INDOOR operations on Jetson Orin Nano (8GB shared RAM)
# 3cm voxels for high-resolution obstacle mapping through doorways
# 5m radius to stay within GPU memory budget at higher resolution
#
# Use case: Task 2 indoor fire extinguishing, doorway clearance (4x4m)
# Switch to this config before entering indoor environment.
#
# Usage:
#   Copy to container and restart nvblox:
#   cp nvblox_indoor.yaml /opt/ros/humble/.../nvblox_base.yaml
# ==============================================================

/**:
  ros__parameters:
    # CUDA stream setting - non-blocking for lower latency
    cuda_stream_type: 2

    # ==============================================================
    # VOXEL SIZE - 3cm for indoor obstacle resolution (NV-003)
    # Required: doorway clearance through 4x4m opening needs < 5cm
    # ==============================================================
    voxel_size: 0.03  # 3cm voxels - high resolution indoor

    # dynamic: depth-based dynamic object detection (people, vehicles)
    # Uses foreground occupancy layer that decays quickly for moving obstacles
    # while static geometry stays in the background TSDF layer
    mapping_type: "dynamic"

    # 3D ESDF for full volumetric mapping
    esdf_mode: "3d"

    # ==============================================================
    # SPEED SETTINGS - indoor rates (higher depth rate for safety)
    # More aggressive integration for tight spaces
    # ==============================================================
    tick_period_ms: 10
    integrate_depth_rate_hz: 15.0    # max rate for safety-critical indoor nav (NV-004)
    integrate_color_rate_hz: 5.0     # color still optional
    integrate_lidar_rate_hz: 0.0
    update_mesh_rate_hz: 3.0         # faster mesh for close obstacles
    update_esdf_rate_hz: 10.0        # fast ESDF for responsive obstacle avoidance
    publish_layer_rate_hz: 5.0
    publish_debug_vis_rate_hz: 1.0
    decay_tsdf_rate_hz: 5.0           # fast decay for indoor dynamic obstacles
    decay_dynamic_occupancy_rate_hz: 10.0  # fast decay for moving obstacles (people)
    clear_map_outside_radius_rate_hz: 2.0  # aggressive clearing

    # Misc
    num_cameras: 1
    use_tf_transforms: true

    # Reduce console output
    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 30000

    # ==============================================================
    # ESDF Settings (3D volumetric)
    # ==============================================================
    publish_esdf_distance_slice: true

    # ==============================================================
    # 3D visualization enabled
    # ==============================================================
    use_color: true
    use_depth: true
    use_lidar: false

    # Input queue - minimal for low latency
    maximum_input_queue_length: 2

    # ==============================================================
    # Map clearing - 5m radius (tighter for indoor, saves GPU memory)
    # At 3cm voxels, 5m radius uses similar memory to 8m at 5cm
    # ==============================================================
    map_clearing_radius_m: 5.0
    map_clearing_frame_id: "base_link"

    # QoS settings
    input_qos: "SYSTEM_DEFAULT"

    # Visualization - 5m view area
    esdf_slice_bounds_visualization_side_length: 5.0
    workspace_height_bounds_visualization_side_length: 5.0
    layer_visualization_exclusion_height_m: 5.0   # indoor ceiling ~3-4m
    layer_visualization_exclusion_radius_m: 5.0
    layer_visualization_min_tsdf_weight: 0.0001
    max_back_projection_distance: 5.0
    back_projection_subsampling: 2  # less subsampling for detail
    layer_streamer_bandwidth_limit_mbps: 30.0

    # Multi-mapper settings
    multi_mapper:
      connected_mask_component_size_threshold: 2000
      remove_small_connected_components: true

    # Static mapper - HIGH RESOLUTION indoor settings
    static_mapper:
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 1

      # Integration distances - 5m range indoor
      projective_integrator_max_integration_distance_m: 5.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 10.0
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0

      # Occupancy settings - tighter for indoor
      free_region_occupancy_probability: 0.45
      occupied_region_occupancy_probability: 0.55
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.06  # tighter for 3cm voxels

      # View calculator
      raycast_subsampling_factor: 4  # less subsampling for accuracy

      # Workspace bounds - indoor heights
      workspace_bounds_type: "height_bounds"
      workspace_bounds_min_height_m: -1.0   # floor
      workspace_bounds_max_height_m: 5.0    # ceiling

      # ESDF integrator - tighter for indoor obstacle avoidance
      esdf_integrator_min_weight: 0.5
      esdf_integrator_max_site_distance_vox: 3.0
      esdf_integrator_max_distance_m: 1.5   # 1.5m max distance field

      # Mesh - indoor settings
      mesh_integrator_min_weight: 1.0
      mesh_integrator_weld_vertices: true

      # Decay - tuned for indoor dynamic obstacle avoidance (NV-007)
      tsdf_decay_factor: 0.80  # aggressive decay indoors for fast-moving people
      tsdf_decayed_weight_threshold: 0.001
      exclude_last_view_from_decay: true
      tsdf_set_free_distance_on_decayed: true  # decayed voxels become freespace in ESDF
      tsdf_decayed_free_distance_vox: 4.0
      decay_integrator_deallocate_decayed_blocks: false  # must be false when tsdf_set_free_distance_on_decayed is true

      # Streaming - 5m radius
      layer_streamer_exclusion_height_m: 5.0
      layer_streamer_exclusion_radius_m: 5.0

    # Dynamic mapper (foreground) - fast-decaying occupancy for moving obstacles
    dynamic_mapper:
      projective_integrator_max_integration_distance_m: 5.0
      occupied_region_occupancy_probability: 0.7
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.06
      free_region_occupancy_probability: 0.3
