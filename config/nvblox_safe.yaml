# ==============================================================
# NOMAD nvblox SAFE Configuration (NV-014)
#
# Conservative profile for guaranteed Jetson Orin Nano operation
# under all thermal/power conditions (even when throttling).
#
# Use when:
#   - Jetson consistently exceeds 80°C
#   - Memory pressure causing slowdowns  
#   - Running on 15W power mode
#   - Battery/power constraints in field
#
# Tradeoff: Reduced obstacle resolution (10cm voxels vs 3cm)
# and slower update rates (2Hz vs 15Hz integration).
#
# Setup:
#   Before launching Isaac ROS:
#   export NOMAD_NVBLOX_CONFIG=/workspaces/isaac_ros-dev/config/nvblox_safe.yaml
#   Or: cp nvblox_safe.yaml nvblox_performance.yaml && restart container
# ==============================================================

/**:
  ros__parameters:
    # CUDA stream setting - non-blocking for lower latency
    cuda_stream_type: 2

    # ==============================================================
    # VOXEL SIZE - 10cm (conservative, 3x coarser than indoor)
    # 10cm is sufficient for navigating ~1m corridors and doorways
    # Reduces GPU memory by ~27x compared to 3cm voxels
    # ==============================================================
    voxel_size: 0.10  # 10cm voxels - safe conservative resolution

    # dynamic: depth-based dynamic object detection (people, vehicles)
    mapping_type: "dynamic"

    # 2D ESDF for lower memory footprint (sufficient for ground-based nav)
    esdf_mode: "2d"

    # ==============================================================
    # SLOW SPEED SETTINGS - guaranteed performance under all load
    # Reduced rates to stay CPU/GPU-bound safe even at 15W
    # ==============================================================
    tick_period_ms: 500  # slower tick (2Hz integration target)
    integrate_depth_rate_hz: 2.0      # very slow depth integration (safe)
    integrate_color_rate_hz: 0.5      # minimal color (disabled)
    integrate_lidar_rate_hz: 0.0      # no lidar
    update_mesh_rate_hz: 1.0          # slow mesh updates
    update_esdf_rate_hz: 1.0          # slow ESDF updates
    publish_layer_rate_hz: 1.0        # minimal publishing
    publish_debug_vis_rate_hz: 0.1    # minimal visualization
    decay_tsdf_rate_hz: 1.0           # slow decay for dynamic obstacles
    decay_dynamic_occupancy_rate_hz: 1.0  # slow decay for moving objects
    clear_map_outside_radius_rate_hz: 0.5  # infrequent clearing

    # Misc
    num_cameras: 1
    use_tf_transforms: true

    # Reduce console output
    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 60000

    # ==============================================================
    # ESDF Settings - 2D (much lower memory than 3D)
    # ==============================================================
    publish_esdf_distance_slice: true

    # ==============================================================
    # 3D visualization disabled (reduces CPU/GPU load)
    # ==============================================================
    use_color: false
    use_depth: true
    use_lidar: false

    # Input queue - minimal for low latency
    maximum_input_queue_length: 1

    # ==============================================================
    # Map clearing - 4m radius (small indoor environments)
    # At 10cm voxels, 4m radius is ~64k voxels
    # ==============================================================
    map_clearing_radius_m: 4.0
    map_clearing_frame_id: "zed_camera_link"

    # QoS settings
    input_qos: "SYSTEM_DEFAULT"

    # Visualization - 4m view area
    esdf_slice_bounds_visualization_side_length: 4.0
    workspace_height_bounds_visualization_side_length: 4.0
    layer_visualization_exclusion_height_m: 4.0   # indoor ceiling ~3-4m
    layer_visualization_exclusion_radius_m: 4.0
    layer_visualization_min_tsdf_weight: 0.0001
    max_back_projection_distance: 4.0
    back_projection_subsampling: 4  # aggressive subsampling
    layer_streamer_bandwidth_limit_mbps: 10.0  # reduced bandwidth

    # Multi-mapper settings
    multi_mapper:
      connected_mask_component_size_threshold: 5000
      remove_small_connected_components: true

    # Static mapper - LOW RESOLUTION conservative settings
    static_mapper:
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 1

      # Integration distances - 4m range
      projective_integrator_max_integration_distance_m: 4.0
      projective_integrator_truncation_distance_vox: 2.0  # conservative truncation
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 5.0  # lower max weight for stability

      # Occupancy settings
      free_region_occupancy_probability: 0.45
      occupied_region_occupancy_probability: 0.55
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.15  # 10cm voxel safety margin

      # View calculator - aggressive subsampling
      raycast_subsampling_factor: 8  # very aggressive subsampling for speed

      # Workspace bounds - indoor heights
      workspace_bounds_type: "height_bounds"
      workspace_bounds_min_height_m: -0.5   # slightly below floor
      workspace_bounds_max_height_m: 4.0    # indoor ceiling

      # ESDF integrator - 2D (much simpler)
      esdf_integrator_min_weight: 0.5
      esdf_integrator_max_site_distance_vox: 2.0  # reduced distance field
      esdf_integrator_max_distance_m: 1.0   # 1m max distance field

      # Mesh - minimal settings
      mesh_integrator_min_weight: 2.0  # only integrate strong observations
      mesh_integrator_weld_vertices: false  # skip expensive vertex welding

      # Decay - slow, stable decay for thermal throttling tolerance
      tsdf_decay_factor: 0.85  # slower decay to accumulate stronger evidence
      tsdf_decayed_weight_threshold: 0.001
      exclude_last_view_from_decay: true
      tsdf_set_free_distance_on_decayed: false  # disable free distance decay (RISKY for obstacles!)
      tsdf_decayed_free_distance_vox: 2.0
      decay_integrator_deallocate_decayed_blocks: true  # aggressive deallocation for memory

      # Streaming - 4m radius
      layer_streamer_exclusion_height_m: 4.0
      layer_streamer_exclusion_radius_m: 4.0

    # Dynamic mapper (foreground) - minimal foreground layer
    dynamic_mapper:
      do_depth_preprocessing: false
      projective_integrator_max_integration_distance_m: 4.0
      projective_integrator_truncation_distance_vox: 1.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 2.0  # very conservative

      occupied_region_occupancy_probability: 0.65  # faster occupancy for moving objects
      free_region_occupancy_probability: 0.35
      raycast_subsampling_factor: 8  # aggressive subsampling

      esdf_integrator_max_site_distance_vox: 1.0
      mesh_integrator_min_weight: 10.0  # only very strong observations
      
      # Aggressive decay - remove moving obstacles quickly
      tsdf_decay_factor: 0.5  # fast decay (people/robots disappear in ~2s)
      tsdf_decayed_weight_threshold: 0.001
      tsdf_set_free_distance_on_decayed: false  # conservative

      # Small streaming radius for foreground
      layer_streamer_exclusion_radius_m: 2.0

    # GPU memory reporting
    allocator_mempool_enabled: false  # disable memory pooling for predictability
